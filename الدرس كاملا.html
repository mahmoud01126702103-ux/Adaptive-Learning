<!doctype html><html lang="ar" dir="rtl" data-theme="dark"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>رحلة أبطال المثلثات</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;900&family=Lalezar&display=swap" rel="stylesheet">
<style>
/* Layout concept: a night-sky trail of three medal stations (bronze, silver, gold) on a triangle-grid ground; one chunky question card per screen, triangle motif everywhere. */
:root{
  --bg:#0A1233;
  --panel:#142057;
  --panel-hi:#1D2C75;
  --edge:#3B4FA8;
  --ink:#FFFFFF;
  --soft:#C4CDF5;
  --gold:#FFC93C;
  --gold-deep:#B8860B;
  --silver:#E3EAF8;
  --bronze:#F29A4B;
  --good:#35E8A2;
  --good-bg:#0C5A44;
  --bad:#FF6075;
  --bad-bg:#6A1B33;
  --violet:#B284FF;
  --blue:#55A8FF;
  --on-bright:#0A1233;
  --paper:#FFFFFF;
  --grid:rgba(120,150,255,.07);
  --font-display:'Lalezar','Cairo','Tahoma',sans-serif;
  --font-body:'Cairo','Tahoma','Segoe UI',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background-color:var(--bg);
  background-image:
    radial-gradient(900px 420px at 50% -80px, rgba(85,120,255,.28), transparent 70%),
    linear-gradient(135deg,var(--grid) 25%,transparent 25%) -32px 0/64px 64px,
    linear-gradient(225deg,var(--grid) 25%,transparent 25%) -32px 0/64px 64px,
    linear-gradient(315deg,var(--grid) 25%,transparent 25%) 0 0/64px 64px,
    linear-gradient(45deg,var(--grid) 25%,transparent 25%) 0 0/64px 64px;
  color:var(--ink);
  font-family:var(--font-body);
  font-size:17px;
  line-height:1.7;
  padding-block:12px 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  min-height:100%;
}
button,input{font-family:inherit}
:focus-visible{outline:3px solid #fff;outline-offset:3px;border-radius:8px}
[tabindex="-1"]:focus{outline:none}
.shell{max-width:880px;margin:0 auto}
.lv0{--lv:var(--bronze)}
.lv1{--lv:var(--silver)}
.lv2{--lv:var(--gold)}

/* top bar */
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-size:21px;color:var(--gold);line-height:1.2}
.brand svg{width:30px;height:30px;flex:none}
.icon-btn{width:46px;height:46px;border-radius:14px;background:var(--panel);border:2px solid var(--edge);color:var(--ink);display:grid;place-items:center;cursor:pointer;flex:none}
.icon-btn svg{width:24px;height:24px}
.icon-btn[aria-pressed="true"]{color:var(--soft);border-style:dashed}

/* entrance */
.enter>*{animation:rise .45s cubic-bezier(.2,.8,.2,1) both}
.enter>*:nth-child(2){animation-delay:.06s}
.enter>*:nth-child(3){animation-delay:.12s}
.enter>*:nth-child(4){animation-delay:.18s}
@keyframes rise{from{transform:translateY(14px)}to{transform:none}}
@keyframes float{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-12px) rotate(4deg)}}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* generic */
.screen{display:flex;flex-direction:column;gap:18px}
.card{position:relative;overflow:hidden;background:var(--panel);border:2px solid var(--edge);border-radius:22px;padding:24px 22px}
.lead{font-size:18px;color:var(--soft);margin:0}
.eyebrow{font-weight:900;font-size:14px;letter-spacing:.04em;color:var(--lv,var(--gold));margin:0}
h2,h3{font-family:var(--font-display);font-weight:400;margin:0;line-height:1.25}
h2{font-size:clamp(28px,7vw,40px)}
.chip{display:inline-block;margin:6px 0 0;padding:2px 14px;border-radius:999px;background:var(--bg);border:2px solid var(--lv,var(--edge));color:var(--ink);font-weight:700;font-size:14px}
.btn{font-family:var(--font-display);font-size:23px;line-height:1.3;padding:12px 28px;border-radius:16px;border:0;cursor:pointer;background:var(--gold);color:var(--on-bright);box-shadow:0 6px 0 var(--gold-deep);transition:transform .08s,box-shadow .08s;align-self:flex-start}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--gold-deep)}
.btn.alt{background:var(--panel-hi);color:var(--ink);border:2px solid var(--edge);box-shadow:0 6px 0 #070D26}
.btn.alt:active{box-shadow:0 2px 0 #070D26}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btnrow{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.ic{width:1.1em;height:1.1em;flex:none}

/* hero */
.hero{position:relative;isolation:isolate;padding:18px 0 6px}
.tri{position:absolute;z-index:-1;clip-path:polygon(50% 0,100% 100%,0 100%);animation:float 7s ease-in-out infinite}
.t1{width:150px;height:130px;right:-14px;top:-12px;background:linear-gradient(160deg,var(--bronze),transparent 75%);opacity:.5}
.t2{width:110px;height:96px;left:6%;top:46px;background:linear-gradient(160deg,var(--silver),transparent 75%);opacity:.35;animation-delay:-2s}
.t3{width:80px;height:70px;left:38%;top:-6px;background:linear-gradient(160deg,var(--gold),transparent 75%);opacity:.45;animation-delay:-4s}
.kicker{margin:0 0 8px;font-weight:700;font-size:15px;color:var(--soft)}
.hero h1{font-family:var(--font-display);font-weight:400;font-size:clamp(42px,12vw,84px);line-height:1.1;margin:0;text-wrap:balance}
.hero h1 em{font-style:normal;color:var(--gold)}
.hero .sub{font-family:var(--font-display);font-size:clamp(26px,7vw,44px);margin:4px 0 12px;line-height:1.2;background:linear-gradient(to left,var(--bronze),var(--silver),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent;width:fit-content}

/* route */
.route{list-style:none;margin:0;padding:14px 12px 12px;display:flex;align-items:flex-start;background:rgba(20,32,87,.7);border:2px solid var(--edge);border-radius:20px}
.st{flex:0 0 auto;width:clamp(84px,24vw,140px);display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;min-width:0}
.st .medal{display:block}
.st-name{font-weight:900;font-size:14px;line-height:1.3}
.st-meta{font-size:12.5px;color:var(--soft);font-weight:700;line-height:1.35}
.st.cur .st-name{color:var(--lv)}
.st.done .st-meta{color:var(--good)}
.st.locked{opacity:.65}
.st.locked .medal{filter:grayscale(1) brightness(.75)}
.link{flex:1;min-width:14px;height:6px;margin-top:34px;border-radius:3px;background:repeating-linear-gradient(90deg,var(--edge) 0 10px,transparent 10px 18px)}
.link.done{background:var(--good)}

/* start form */
.start{display:flex;flex-direction:column;gap:12px}
.start label{font-weight:900;font-size:18px}
.start input{width:100%;font-size:22px;font-weight:700;padding:14px 16px;border-radius:14px;background:var(--bg);color:var(--ink);border:2px solid var(--edge)}
.start input::placeholder{color:#8190D0}
.start input:focus{border-color:var(--gold);outline:none;box-shadow:0 0 0 3px rgba(255,201,60,.35)}
.err{margin:0;color:var(--bad);font-weight:900}

/* level intro */
.lvhead{display:flex;align-items:center;gap:16px;margin-bottom:12px}
.how{margin:16px 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.how li{display:flex;gap:10px;align-items:flex-start;font-weight:500}
.how li::before{content:"";flex:none;width:14px;height:14px;margin-top:8px;background:var(--lv);clip-path:polygon(50% 0,100% 100%,0 100%)}
.rule{margin:0 0 18px;padding:10px 14px;border-radius:12px;background:var(--bg);border:2px dashed var(--lv);font-weight:700}
.rule b{color:var(--lv)}

/* hud */
.hud{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--panel);border:2px solid var(--edge);border-radius:18px;padding:10px 14px}
.hud-lv{display:flex;align-items:center;gap:10px;min-width:0}
.hud-lv div{display:flex;flex-direction:column;line-height:1.3;min-width:0}
.hud-lv b{font-size:13px;color:var(--lv)}
.hud-lv span{font-family:var(--font-display);font-size:20px}
.hud-score{display:flex;align-items:baseline;gap:6px;white-space:nowrap}
.hud-score span{font-size:13px;color:var(--soft);font-weight:700}
.hud-score b{font-size:28px;font-weight:900;color:var(--gold);line-height:1}
.hud-score small{color:var(--soft);font-weight:700}
.dots{display:flex;gap:6px}
.dot{flex:1;height:12px;border-radius:6px;background:var(--panel);border:2px solid var(--edge)}
.dot.ok{background:var(--good);border-color:var(--good)}
.dot.no{background:repeating-linear-gradient(45deg,var(--bad) 0 4px,var(--bad-bg) 4px 8px);border-color:var(--bad)}
.dot.cur{border-color:#fff;box-shadow:0 0 0 2px var(--lv)}

/* question card */
.q::after{content:"";position:absolute;top:0;right:0;width:70px;height:70px;background:var(--lv);clip-path:polygon(0 0,100% 0,100% 100%)}
.topic{display:inline-block;padding:2px 14px;border-radius:999px;background:var(--bg);border:2px solid var(--lv);color:var(--lv);font-weight:900;font-size:14px;margin:0 0 6px}
.qno{font-weight:700;font-size:14px;color:var(--soft);margin:0}
.qtext{font-size:clamp(21px,5.4vw,30px);font-weight:900;line-height:1.55;margin:6px 0 20px;text-wrap:pretty;padding-inline-end:48px}
.fig{display:block;width:min(300px,100%);margin:0 auto 18px;background:var(--bg);border:2px solid var(--edge);border-radius:16px;padding:8px}
.fig text{font-family:var(--font-body);font-weight:900;font-size:19px;fill:#fff;text-anchor:middle}

/* true false */
.tf{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tfb{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:22px 10px;border-radius:20px;border:3px solid;font-family:var(--font-display);font-size:clamp(30px,8vw,44px);line-height:1.2;color:var(--ink);cursor:pointer;transition:transform .08s}
.tfb .ic{width:1.1em;height:1.1em}
.tfb.yes{background:var(--good-bg);border-color:var(--good);box-shadow:0 7px 0 #063B2C}
.tfb.no{background:var(--bad-bg);border-color:var(--bad);box-shadow:0 7px 0 #40101F}
.tfb:not(:disabled):active{transform:translateY(5px);box-shadow:none}
.tfb:disabled{cursor:default}
.tfb.dim{opacity:.4}
.tfb.right{outline:4px solid #fff;outline-offset:3px}
.tfb.wrong{animation:shake .35s}
.tfb small{font-family:var(--font-body);font-size:14px;font-weight:900;background:#fff;color:var(--on-bright);border-radius:999px;padding:0 12px}

/* multiple choice */
.opts{display:grid;gap:12px}
.opt{display:flex;align-items:center;gap:12px;text-align:right;background:var(--panel-hi);border:3px solid var(--edge);border-radius:16px;padding:12px 14px;color:var(--ink);font-size:19px;font-weight:700;line-height:1.5;cursor:pointer;width:100%;min-width:0}
.opt .ltr{flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--lv);color:var(--on-bright);font-weight:900;font-size:20px}
.opt .otx{flex:1;min-width:0}
.opt:not(:disabled):hover{border-color:var(--lv)}
.opt:disabled{cursor:default}
.opt.right{background:var(--good-bg);border-color:var(--good)}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad);animation:shake .35s}
.opt.dim{opacity:.45}
.opt .ic{width:28px;height:28px}

/* matching */
.mhint{margin:0 0 14px;color:var(--soft);font-weight:700;font-size:16px}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.mcol{display:flex;flex-direction:column;gap:10px;min-width:0}
.mcol h3{font-family:var(--font-body);font-weight:900;font-size:15px;color:var(--lv);margin:0 0 2px}
.mchip{display:flex;gap:8px;align-items:flex-start;text-align:right;width:100%;min-width:0;background:var(--panel-hi);border:3px solid var(--edge);border-radius:14px;padding:9px 10px;color:var(--ink);font-size:15.5px;font-weight:700;line-height:1.5;cursor:pointer}
.mchip .tag{flex:none;min-width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--bg);border:2px solid var(--edge);font-weight:900;font-size:15px}
.mchip .mtx{flex:1;min-width:0;padding-top:2px}
.mchip .pill{flex:none;min-width:30px;height:30px;border-radius:999px;display:grid;place-items:center;background:var(--pc);color:var(--on-bright);font-weight:900;font-size:15px}
.mchip.sel{border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,201,60,.45)}
.mchip.paired{border-color:var(--pc)}
.mchip.paired .tag{background:var(--pc);border-color:var(--pc);color:var(--on-bright)}
.mchip:disabled{cursor:default}
.mchip.ok{background:var(--good-bg);border-color:var(--good)}
.mchip.bad{background:var(--bad-bg);border-color:var(--bad)}
.mchip .ic{width:24px;height:24px;flex:none;margin-top:3px}
.mcount{font-weight:900;color:var(--soft)}

/* feedback */
.fb{display:flex;gap:12px;align-items:flex-start;margin-top:18px;padding:14px 16px;border-radius:18px;border:3px solid}
.fb .ic{width:34px;height:34px;margin-top:2px}
.fb h3{font-size:26px}
.fb p{margin:2px 0 0;font-weight:500}
.fb .why{font-weight:900}
.fb.ok{background:var(--good-bg);border-color:var(--good)}
.fb.ok .ic{color:var(--good)}
.fb.no{background:var(--bad-bg);border-color:var(--bad)}
.fb.no .ic{color:var(--bad)}
.fb.mid{background:#4A3A07;border-color:var(--gold)}
.fb.mid .ic{color:var(--gold)}
.fb .body{flex:1;min-width:0}
.plus{flex:none;font-family:var(--font-display);font-size:30px;color:var(--gold);animation:pop .5s both;line-height:1.2}
.miss{margin:8px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.miss li{background:rgba(10,18,51,.55);border-radius:10px;padding:6px 10px;font-weight:700;font-size:15.5px}
.next{margin-top:18px}

/* result */
.result{text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
.result .bdg{animation:pop .6s both}
.tier{font-family:var(--font-display);font-size:clamp(30px,8vw,44px);line-height:1.2;margin:0}
.tier-sub{margin:0;font-weight:900;color:var(--soft)}
.big{font-size:56px;font-weight:900;line-height:1;color:var(--gold)}
.big small{font-size:20px;color:var(--soft)}
.msg{max-width:560px;margin:0;font-size:18px}
.cta-pill{display:inline-block;padding:4px 18px;border-radius:999px;background:var(--gold);color:var(--on-bright);font-weight:900}
.passmsg{max-width:560px;padding:12px 16px;border-radius:14px;background:var(--good-bg);border:2px solid var(--good);font-weight:700;margin:0}
details{width:100%;max-width:620px;text-align:right;background:var(--bg);border:2px solid var(--edge);border-radius:14px;padding:10px 14px}
summary{cursor:pointer;font-weight:900;font-size:17px}
details .miss{margin-top:10px}
.rev-q{display:block;color:var(--soft);font-weight:500;font-size:14.5px}

/* board */
.tablewrap{overflow-x:auto;border:2px solid var(--edge);border-radius:16px;background:var(--bg)}
table{width:100%;min-width:560px;border-collapse:collapse;text-align:center}
th,td{padding:10px 8px;border-bottom:1px solid var(--edge);font-variant-numeric:tabular-nums}
th{background:var(--panel-hi);font-size:14px;color:var(--soft);font-weight:900}
td:nth-child(2){text-align:right;font-weight:900}
tr.me td{background:rgba(255,201,60,.14)}
tr:last-child td{border-bottom:0}
.rk{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--panel-hi);font-weight:900}
.rk.r1{background:var(--gold);color:var(--on-bright)}
.rk.r2{background:var(--silver);color:var(--on-bright)}
.rk.r3{background:var(--bronze);color:var(--on-bright)}
.bd{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:14px}
.empty{padding:26px;text-align:center;color:var(--soft);font-weight:700}
.note{margin:0;max-width:560px;color:var(--soft);font-weight:700}
.stats{display:flex;flex-wrap:wrap;justify-content:center;gap:14px}
.stat{min-width:130px;padding:10px 16px;border-radius:16px;background:var(--bg);border:2px solid var(--edge)}
.stat b{display:block;font-size:34px;font-weight:900;color:var(--gold);line-height:1.2}
.stat span{font-size:14px;color:var(--soft);font-weight:700}


/* cover screen: one centred column, logos on top, title in the middle, credits below */
.topbar[hidden]{display:none}
.topbtns{display:flex;gap:10px;align-items:center}
.cv-top{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:16px}
.logo-plate{background:var(--paper);border-radius:16px;padding:8px 16px;display:flex;align-items:center;justify-content:center;border:2px solid var(--edge);min-width:0}
.logo-plate img{display:block;height:84px;width:auto;max-width:100%}
.cv-card{display:flex;flex-direction:column;align-items:center;text-align:center;gap:20px;padding:44px 28px 40px;isolation:isolate}
.cv-card .chip{margin:0;font-size:15px;line-height:1.6;padding:4px 18px;white-space:normal}
.cv-title{margin:0;font-family:var(--font-display);font-weight:400;line-height:1.15;text-wrap:balance}
.cv-title .a{display:block;font-size:clamp(42px,9vw,84px);color:var(--ink)}
.cv-title .a em{font-style:normal;color:var(--gold)}
.cv-title .b{display:block;font-size:clamp(28px,6vw,48px);margin:4px auto 0;background:linear-gradient(to left,var(--bronze),var(--silver),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent;width:fit-content}
.cv-medals{display:flex;gap:16px;align-items:flex-end;justify-content:center}
.credits{display:grid;gap:18px;width:100%;max-width:600px;margin-top:4px;padding-top:20px;border-top:2px dashed var(--edge)}
.cr h3{font-family:var(--font-body);font-weight:900;font-size:15px;color:var(--gold);letter-spacing:.04em;margin:0 0 2px}
.cr p{margin:0;font-weight:900;font-size:clamp(21px,4.8vw,28px);line-height:1.6}
.sups{display:flex;flex-wrap:wrap;justify-content:center;gap:0 40px}
.cr .sup{font-size:clamp(19px,4.4vw,24px)}
.cv-actions{justify-content:center;margin-top:6px}
@media (max-width:560px){
  .cv-card{padding:36px 16px 30px}
  .logo-plate img{height:64px}
  .logo-plate{padding:6px 10px}
}

[hidden]{display:none!important}
/* ---- sticky navigation ---- */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:31;background:var(--bg)}
.navwrap{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);padding:6px 0 10px;margin-bottom:6px;border-bottom:2px solid var(--panel)}
.navbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;max-width:880px;margin:0 auto}
.brand{margin-inline-end:auto}
.who{font-weight:900;font-size:14px;color:var(--bg);background:var(--gold);border-radius:999px;padding:2px 14px;white-space:nowrap}
.nav{display:flex;gap:6px;flex:1 1 100%;order:3;justify-content:space-between}
.nbtn{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 4px;border-radius:14px;border:2px solid var(--edge);background:var(--panel);color:var(--soft);font-weight:900;font-size:12.5px;line-height:1.3;cursor:pointer}
.nbtn .ni{width:22px;height:22px}
.nbtn span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.nbtn.on{background:var(--gold);border-color:var(--gold);color:var(--on-bright)}
.nbtn:not(.on):hover{border-color:var(--gold);color:var(--ink)}
@media (min-width:640px){.nav{gap:8px}.nbtn{flex-direction:row;justify-content:center;gap:8px;padding:7px 12px;font-size:15px}.nbtn .ni{width:20px;height:20px}}
/* ---- overlays ---- */
.dlg{position:fixed;inset:0;z-index:80;background:rgba(5,9,28,.78);display:grid;place-items:center;padding:16px}
.dlg-box{background:var(--panel);border:3px solid var(--gold);border-radius:22px;padding:22px;max-width:560px;width:100%;max-height:88vh;overflow:auto}
.dlg-box h3{font-family:var(--font-display);font-weight:400;font-size:26px;margin:0 0 8px}
.dlg-box h4{margin:14px 0 4px;color:var(--gold);font-size:15px}
.dlg-box p{margin:6px 0}
.qfull{font-weight:900;font-size:19px;line-height:1.6}
#tip{position:fixed;z-index:90;background:#fff;color:var(--on-bright);padding:6px 12px;border-radius:10px;font-weight:700;font-size:14px;pointer-events:none;max-width:min(320px,90vw);line-height:1.5}
#toast{position:fixed;z-index:95;inset-inline:16px;bottom:calc(18px + env(safe-area-inset-bottom,0px));margin:0 auto;max-width:460px;background:var(--gold);color:var(--on-bright);font-weight:900;padding:10px 18px;border-radius:14px;text-align:center}
/* ---- student additions ---- */
.greet{margin:0;font-family:var(--font-display);font-size:clamp(22px,5.4vw,32px);line-height:1.4;color:var(--gold)}
.picks{display:flex;flex-wrap:wrap;gap:10px}
.pick{display:flex;align-items:center;gap:8px;padding:6px 14px;border-radius:999px;background:var(--panel);border:2px solid var(--edge);color:var(--ink);font-weight:900;font-size:15px;cursor:pointer}
.pick.on{border-color:var(--gold);background:var(--panel-hi)}
.prog{margin:-6px 0 0;text-align:center;font-weight:700;font-size:14px;color:var(--soft)}
.syncnote{margin:10px 0 0;padding:8px 12px;border-radius:12px;background:var(--bg);border:2px dashed var(--bronze);color:var(--soft);font-weight:700;font-size:14.5px}
.rule.resume{border-color:var(--good)}
.btn.danger{background:var(--bad);color:var(--on-bright);box-shadow:0 6px 0 #8F1A2E}
.you{background:var(--gold);color:var(--on-bright);border-radius:999px;padding:0 8px;font-weight:900}
.bds .bd,.bd2{display:inline-flex;align-items:center;gap:2px;margin-inline:3px}
.bd.off{color:var(--soft)}
.rk svg{display:block}
td.bds{white-space:nowrap}
/* ---- profile ---- */
.stats.left{justify-content:flex-start;margin-top:14px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin:14px 0}
.facts div{background:var(--bg);border:2px solid var(--edge);border-radius:14px;padding:8px 14px}
.facts dt{font-size:13px;font-weight:900;color:var(--gold)}
.facts dd{margin:0;font-weight:700}
.bdrow{display:flex;flex-wrap:wrap;gap:14px}
.bd2{gap:10px;background:var(--bg);border:2px solid var(--edge);border-radius:14px;padding:6px 12px}
.bd2 small{line-height:1.4;font-weight:700;color:var(--soft)}
.bd2.off{opacity:.55}
.panel{background:var(--panel);border:2px solid var(--edge);border-radius:20px;padding:18px;min-width:0}
.panel h3{font-family:var(--font-display);font-weight:400;font-size:23px;margin:0 0 10px;line-height:1.35}
.panel h4{margin:14px 0 4px;color:var(--gold);font-size:15px}
.panel.exec{border-color:var(--gold)}
.sec{font-family:var(--font-display);font-weight:400;font-size:28px;margin:10px 0 0}
.muted{color:var(--soft);margin:6px 0}
.small{font-size:14px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.ul{margin:6px 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.ul li{display:flex;gap:10px;align-items:flex-start}
.ul li::before{content:"";flex:none;width:12px;height:12px;margin-top:9px;background:var(--gold);clip-path:polygon(50% 0,100% 100%,0 100%)}
.ul.num{counter-reset:c}.ul.num li::before{counter-increment:c;content:counter(c);width:26px;height:26px;margin-top:2px;border-radius:50%;clip-path:none;display:grid;place-items:center;color:var(--on-bright);font-weight:900;font-size:14px}
.ans{color:var(--good);font-weight:900;margin-inline-start:6px}
.miss.big li{font-size:16px;line-height:1.7}
.bad-t{color:#FF9AA8;font-weight:700}.good-t{color:var(--good);font-weight:700}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:16px}
.screen>.panel,.screen>.card{min-width:0}
/* ---- teacher ---- */
.thead .filters{display:flex;flex-wrap:wrap;gap:12px;margin:12px 0}
.filters label,.inl{display:flex;flex-direction:column;gap:4px;font-weight:900;font-size:14px;color:var(--gold)}
.inl{flex-direction:row;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap}
select{font-family:inherit;font-size:16px;font-weight:700;background:var(--bg);color:var(--ink);border:2px solid var(--edge);border-radius:12px;padding:8px 12px;max-width:100%;min-width:180px}
select:focus{border-color:var(--gold);outline:none}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.tab{font-family:inherit;font-weight:900;font-size:15px;padding:8px 14px;border-radius:12px;border:2px solid var(--edge);background:var(--bg);color:var(--soft);cursor:pointer}
.tab.on{background:var(--gold);border-color:var(--gold);color:var(--on-bright)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:var(--panel);border:2px solid var(--edge);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;min-width:0}
.kpi b{font-size:30px;font-weight:900;color:var(--gold);line-height:1.2;font-variant-numeric:tabular-nums}
.kpi span{font-weight:900;font-size:14.5px}
.kpi em{font-style:normal;color:var(--soft);font-size:13px;overflow-wrap:anywhere}
.alerts{background:var(--bad-bg);border:3px solid var(--bad);border-radius:18px;padding:10px 16px}
.alerts p{margin:4px 0;font-weight:700}
.ch{display:block;width:100%;height:auto}
.ax{fill:var(--soft);font:700 12.5px var(--font-body)}
.ax.cat{font-size:13px;fill:var(--ink)}
.vl{fill:var(--on-bright);font:900 13px var(--font-body)}
.vl.out{fill:var(--ink)}
.gl{stroke:var(--edge);stroke-width:1;stroke-dasharray:3 5;opacity:.8}
.trk{fill:var(--panel-hi)}
.ch [data-tip]{cursor:pointer}
.lgd{display:flex;flex-wrap:wrap;gap:14px;font-weight:700;font-size:14px;margin-bottom:4px}
.lgd i{display:inline-block;width:14px;height:14px;border-radius:4px;margin-inline-end:6px;vertical-align:-2px}
.nodata{margin:8px 0;padding:18px;text-align:center;color:var(--soft);font-weight:700;border:2px dashed var(--edge);border-radius:14px}
table.mini{min-width:640px;font-size:15px}
table.mini th,table.mini td{padding:8px 6px}
table.mini td{text-align:center}
table.mini td:first-child{text-align:right}
table.qtab td.qt{text-align:right;min-width:240px;max-width:380px}
tr.clk{cursor:pointer}tr.clk:hover td{background:rgba(255,201,60,.1)}
.lnk{background:none;border:0;color:var(--gold);font:inherit;font-weight:900;text-decoration:underline;cursor:pointer;padding:0;text-align:right}
.ql{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.ql button{width:100%;text-align:right;display:flex;flex-direction:column;gap:2px;background:var(--bg);border:2px solid var(--edge);border-radius:14px;padding:8px 12px;color:var(--ink);font:inherit;font-weight:700;cursor:pointer}
.ql button:hover{border-color:var(--gold)}
.ql em{font-style:normal;font-size:13px;color:var(--soft)}
.pill2{display:inline-block;padding:0 12px;border-radius:999px;font-size:13px;font-weight:900;color:var(--on-bright);vertical-align:middle}
.s-good .pill2,.pill2.s-good{background:var(--good)}.pill2.s-mid{background:var(--gold)}.pill2.s-weak{background:var(--bad)}.pill2.s-none{background:var(--soft)}
.panel.con.s-weak{border-color:var(--bad)}.panel.con.s-mid{border-color:var(--gold)}.panel.con.s-good{border-color:var(--good)}
.diag{font-weight:900;margin:4px 0 8px}
.bar{height:12px;border-radius:6px;background:var(--panel-hi);overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px}
.gate{text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
.lock{width:64px;height:64px;color:var(--gold)}
.ch text{pointer-events:none}
.ch{direction:ltr}

#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}

@media (max-width:520px){
  .card{padding:20px 14px}
  .mchip{font-size:14.5px;padding:8px}
  .opt{font-size:17px}
  .qtext{padding-inline-end:40px}
  .q::after{width:56px;height:56px}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}


/* ==================== أنماط التطوير (add.css) ==================== */
/* ============================================================
   رحلة أبطال المثلثات — أنماط طبقة التطوير
   (تُضاف بعد الأنماط الأصلية، ولا تلغي دلالات ألوان الإشارات)
   ============================================================ */

/* ---------- 1) الوضع الفاتح ---------- */
html[data-theme="light"]{
  color-scheme:light;
  --bg:#EDF1FA;
  --panel:#FFFFFF;
  --panel-hi:#F3F6FF;
  --edge:#BFCBEA;
  --ink:#111A36;
  --soft:#4C5C86;
  --gold:#F2B01E;
  --gold-deep:#B77E00;
  --silver:#8FA2C8;
  --bronze:#C9762E;
  --good:#0E9F6E;
  --good-bg:#DCF7EC;
  --bad:#D93B54;
  --bad-bg:#FFE4E9;
  --violet:#7A45D8;
  --blue:#2F6FE0;
  --on-bright:#141008;
  --paper:#FFFFFF;
  --grid:rgba(30,60,140,.05);
}
html[data-theme="light"] body{
  background-color:#EDF1FA;
  background-image:
    radial-gradient(900px 420px at 50% -80px, rgba(120,160,255,.30), transparent 70%),
    linear-gradient(135deg,var(--grid) 25%,transparent 25%) -32px 0/64px 64px,
    linear-gradient(225deg,var(--grid) 25%,transparent 25%) -32px 0/64px 64px,
    linear-gradient(315deg,var(--grid) 25%,transparent 25%) 0 0/64px 64px,
    linear-gradient(45deg,var(--grid) 25%,transparent 25%) 0 0/64px 64px;
  color:var(--ink);
}
html[data-theme="light"] .btn.alt{box-shadow:0 6px 0 #C9D3EC}
html[data-theme="light"] .btn.alt:active{box-shadow:0 2px 0 #C9D3EC}
html[data-theme="light"] .card{box-shadow:0 8px 26px rgba(30,50,110,.10)}
html[data-theme="light"] .who{background:var(--gold);color:#1A1300}
html[data-theme="light"] .fig text,
html[data-theme="light"] .lab-t{fill:#152048}
html[data-theme="light"] #tip{background:#111A36;color:#fff}
html[data-theme="light"] .illu text{fill:#152048}
html[data-theme="light"] .cert{background:#FFFDF6}
html[data-theme="light"] .cert-t,
html[data-theme="light"] .cert-name{color:#8A6200}

/* ---------- 2) القلوب والعدّاد الثابت ---------- */
.heartpill{
  display:flex;align-items:center;gap:6px;
  border:2px solid var(--edge);background:var(--panel);
  color:var(--ink);border-radius:999px;padding:5px 12px 5px 10px;
  font-weight:900;font-size:16px;cursor:pointer;line-height:1;
  transition:transform .15s ease, box-shadow .15s ease;
}
.heartpill:hover{transform:translateY(-1px)}
.heartpill b{font-family:var(--font-display);font-size:20px;min-width:2.2ch;text-align:center}
.heartpill.bump{animation:hpBump .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes hpBump{0%{transform:scale(1)}40%{transform:scale(1.22)}100%{transform:scale(1)}}
.hrt{display:inline-flex;width:22px;height:22px;flex:none}
.hrt svg{width:100%;height:100%}
.hrt.sm{width:17px;height:17px;vertical-align:-3px}
.fly-heart{position:fixed;width:34px;height:34px;z-index:9999;pointer-events:none;filter:drop-shadow(0 4px 6px rgba(0,0,0,.35))}
.fly-heart svg{width:100%;height:100%}
.heart-plus{
  position:sticky;bottom:14px;align-self:center;z-index:60;
  background:linear-gradient(135deg,#FF9AB0,#E0245E);color:#fff;font-weight:900;
  border-radius:999px;padding:7px 18px;margin-top:8px;box-shadow:0 8px 20px rgba(224,36,94,.4);
  transition:opacity .5s ease, transform .5s ease;
}
.heart-plus.out{opacity:0;transform:translateY(-14px)}
.hud-hearts{display:flex;align-items:center;gap:7px;margin-top:10px;background:rgba(224,36,94,.12);
  border:2px solid rgba(255,96,117,.35);border-radius:14px;padding:6px 12px;font-weight:900;flex-wrap:wrap}
.hud-hearts b{font-family:var(--font-display);font-size:22px;color:#FF9AB0}
.hud-hearts .hlab{font-size:13px;color:var(--soft)}
.hud-hearts .htip{font-size:12px;color:var(--soft);font-weight:700;margin-inline-start:auto}
html[data-theme="light"] .hud-hearts b{color:#C42C5F}

/* ---------- 3) الصور الرمزية ---------- */
.av{display:block;border-radius:50%;flex:none}
.avbox{margin-top:16px;border:2px dashed var(--edge);border-radius:18px;padding:14px}
.avhead{font-weight:900;margin:0 0 10px}
.avhead small{font-weight:700;color:var(--soft)}
.avgroup{margin-bottom:10px}
.avlab{font-size:13px;font-weight:900;color:var(--soft)}
.avrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.avbtn{display:flex;flex-direction:column;align-items:center;gap:5px;background:var(--panel-hi);
  border:3px solid var(--edge);border-radius:16px;padding:8px 10px;cursor:pointer;color:var(--ink);font-size:11.5px;font-weight:800;max-width:96px}
.avbtn span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.avbtn.on{border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,201,60,.35);background:var(--gold);color:var(--on-bright)}
.avnote{margin:8px 0 0;font-size:13px;color:var(--soft);font-weight:700}
.who.withav{display:inline-flex;align-items:center;gap:8px;padding:3px 12px 3px 4px}
.avwrap{display:inline-block;vertical-align:middle;margin-inline-end:10px}

/* ---------- 4) خريطة الرحلة ---------- */
.map{list-style:none;display:flex;flex-direction:column;gap:14px;margin:16px 0;padding:0}
.mapcard{display:flex;gap:14px;align-items:flex-start;background:var(--panel-hi);border:2px solid var(--edge);
  border-radius:20px;padding:16px}
.mapcard.done{border-color:rgba(53,232,162,.55)}
.mapcard.cur{border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,201,60,.18)}
.mapcard.locked{opacity:.62}
.mapmedal{flex:none}
.mapbody h3{margin:2px 0 8px;font-family:var(--font-display);font-size:22px}
.mapmeta{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 8px}
.mapscore,.maplab{margin:4px 0;font-weight:700;font-size:14.5px}
.maphearts{display:flex;align-items:center;gap:8px;font-weight:900;background:rgba(224,36,94,.1);
  border:2px solid rgba(255,96,117,.3);border-radius:14px;padding:8px 14px;margin-top:12px}

/* إشارات */
.sigpill{display:inline-block;border-radius:999px;padding:2px 12px;font-size:13px;font-weight:900;border:2px solid}
.sig-gray{color:#93A4CC;border-color:#93A4CC;background:rgba(147,164,204,.12)}
.sig-red{color:#FF6075;border-color:#FF6075;background:rgba(255,96,117,.14)}
.sig-yellow{color:#FFC93C;border-color:#FFC93C;background:rgba(255,201,60,.14)}
.sig-green{color:#35E8A2;border-color:#35E8A2;background:rgba(53,232,162,.14)}
.sig-none{color:var(--soft);border-color:var(--edge);background:transparent}
html[data-theme="light"] .sig-gray{color:#5C6B92;border-color:#93A4CC}
html[data-theme="light"] .sig-red{color:#B3172C;border-color:#D93B54}
html[data-theme="light"] .sig-yellow{color:#8A6200;border-color:#E0A100}
html[data-theme="light"] .sig-green{color:#0A7A55;border-color:#0E9F6E}
.sig-red-txt{color:#FF6075}
.ok-t{color:var(--good)}
.bad-t{color:var(--bad)}

/* ---------- 5) الإعدادات ---------- */
.setrow{display:flex;gap:14px;justify-content:space-between;align-items:center;flex-wrap:wrap;
  padding:14px 0;border-bottom:1px solid var(--edge)}
.setrow h3{margin:0 0 4px;font-size:17px;font-family:var(--font-display)}
.setrow p{margin:0}
.seg{display:flex;border:2px solid var(--edge);border-radius:14px;overflow:hidden;background:var(--panel-hi)}
.segbtn{background:transparent;border:0;color:var(--soft);font-weight:900;padding:9px 18px;cursor:pointer;font-size:15px}
.segbtn.on{background:var(--gold);color:var(--on-bright)}
.switch{width:58px;height:32px;border-radius:999px;border:2px solid var(--edge);background:var(--panel-hi);
  position:relative;cursor:pointer;padding:0}
.switch span{position:absolute;top:2px;inset-inline-start:2px;width:24px;height:24px;border-radius:50%;
  background:var(--soft);transition:.2s}
.switch[aria-checked="true"]{background:rgba(53,232,162,.25);border-color:var(--good)}
.switch[aria-checked="true"] span{background:var(--good);inset-inline-start:calc(100% - 26px)}
.sep{border:0;border-top:1px solid var(--edge);margin:6px 0}
.btn.ghost{background:transparent;border:2px solid var(--edge);color:var(--soft);box-shadow:none;font-size:17px}
.btn.tiny{font-size:14px;padding:6px 14px;box-shadow:0 3px 0 var(--gold-deep)}
.theme-btn svg{width:24px;height:24px}
.icon-btn{display:grid;place-items:center}

/* ---------- 6) الدليل المصوّر ---------- */
.guide .ghead h2{font-family:var(--font-display);font-size:clamp(24px,4vw,32px);margin:4px 0 0}
.gbody{display:grid;grid-template-columns:1fr;gap:18px;margin-top:16px}
@media (min-width:760px){.gbody{grid-template-columns:minmax(240px,42%) 1fr;gap:22px;align-items:start}}
.gstage{background:linear-gradient(160deg,rgba(85,168,255,.14),transparent 70%);border:2px solid var(--edge);
  border-radius:18px;padding:10px;display:grid;place-items:center;min-height:180px}
.illu{width:100%;max-width:320px;height:auto}
.gprog{height:10px;border-radius:999px;background:var(--panel-hi);border:1px solid var(--edge);overflow:hidden;margin-top:12px}
.gprog span{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--good));transition:width .4s ease}
.gdots{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.gdots i{width:9px;height:9px;border-radius:50%;background:var(--edge)}
.gdots i.done{background:var(--soft)}
.gdots i.on{background:var(--gold);transform:scale(1.35)}
.gtext{font-size:17.5px;line-height:1.9;margin:0 0 12px}
.gbullets{margin:0 0 16px;padding-inline-start:20px;display:flex;flex-direction:column;gap:9px}
.gbullets li{line-height:1.75}
.gstep{animation:gIn .45s ease both;animation-delay:var(--d,0ms)}
@keyframes gIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.gbtns{margin-top:6px}

/* ---------- 7) مختبر المثلثات ---------- */
.labwrap{display:grid;grid-template-columns:1fr;gap:18px;margin-top:14px}
@media (min-width:820px){.labwrap{grid-template-columns:minmax(300px,1.05fr) minmax(280px,1fr)}}
.labstage{background:radial-gradient(600px 300px at 50% 0,rgba(85,168,255,.12),transparent 70%),
  var(--panel-hi);border:2px solid var(--edge);border-radius:18px;padding:8px}
.labsvg{width:100%;height:auto;touch-action:none;display:block;cursor:grab}
.labsvg:active{cursor:grabbing}
.lh{cursor:grab;filter:drop-shadow(0 2px 4px rgba(0,0,0,.4))}
.lh:hover{stroke-width:5}
.lab-t{fill:#FFFFFF;font-family:var(--font-body);font-size:12.5px;font-weight:800}
.lab-t.side{fill:#7CE7FF;font-size:11.5px}
.lab-eq{fill:#35E8A2;font-family:var(--font-body);font-size:12px;font-weight:800}
.labread{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}
@media (min-width:520px){.labread{grid-template-columns:repeat(3,minmax(0,1fr))}}
.lrd{background:var(--panel);border:1px solid var(--edge);border-radius:12px;padding:7px 10px;display:flex;flex-direction:column;gap:2px}
.lrd span{font-size:12px;color:var(--soft);font-weight:800}
.lrd b{font-size:16px;font-family:var(--font-display)}
.labside{display:flex;flex-direction:column;gap:12px}
.labprog .bar{height:12px;border-radius:999px;background:var(--panel-hi);border:1px solid var(--edge);overflow:hidden}
.labprog .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--good));transition:width .35s ease}
.labprog span{font-size:13px;font-weight:800;color:var(--soft)}
.labtasks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.labtask{display:flex;gap:10px;background:var(--panel-hi);border:2px solid var(--edge);border-radius:14px;padding:10px 12px}
.labtask.ok{border-color:rgba(53,232,162,.6);background:rgba(53,232,162,.08)}
.labtask .tick{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;
  background:var(--panel);border:2px solid var(--edge);font-weight:900;color:var(--soft)}
.labtask.ok .tick{background:var(--good);border-color:var(--good);color:#04170F}
.labtask b{font-size:15px;display:block;line-height:1.5}
.labhint{margin:4px 0 0;font-size:13px;color:var(--soft);line-height:1.6}
.labwhy{margin:6px 0 0;font-size:13px;font-weight:700;line-height:1.6}
.labq{display:grid;gap:7px;margin-top:8px}
.labopt{text-align:start;background:var(--panel-hi);border:2px solid var(--edge);border-radius:11px;
  padding:10px 14px;color:var(--ink);font-weight:800;font-size:15px;cursor:pointer;width:100%}
.labopt:hover:not([disabled]){border-color:var(--gold);background:var(--panel)}
.labopt:hover:not([disabled]){border-color:var(--gold)}
.labopt.on.ok{border-color:var(--good);background:rgba(53,232,162,.16)}
.labopt.on.bad{border-color:var(--bad);background:rgba(255,96,117,.16)}
.labsliders{display:grid;gap:8px;background:var(--panel-hi);border:1px solid var(--edge);border-radius:14px;padding:10px 12px}
.labsliders label{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:13.5px;font-weight:800;color:var(--soft)}
.labsliders input[type=range]{flex:1;accent-color:var(--gold)}
.labdone{background:rgba(53,232,162,.12);border:2px solid rgba(53,232,162,.5);border-radius:14px;padding:10px 12px;font-weight:800;margin:0}

/* ---------- 8) مشهد الانتقال ---------- */
.scene{overflow:hidden}
.scene-sky{position:relative;height:210px;border-radius:18px;overflow:hidden;margin:8px 0 16px;
  background:linear-gradient(180deg,rgba(85,168,255,.22),rgba(10,18,51,.05) 65%),var(--panel-hi);
  border:2px solid var(--edge)}
html[data-theme="light"] .scene-sky{background:linear-gradient(180deg,#DCE9FF,#F5F8FF 70%)}
.scTrack{position:absolute;inset:0;overflow:hidden}
.scShapes{position:absolute;inset:0;animation:scrolly 6s linear infinite}
.sh{position:absolute;display:block;opacity:.55}
.sh.t,.sh.t2{width:0;height:0;border-left:16px solid transparent;border-right:16px solid transparent;border-bottom:28px solid var(--gold)}
.sh.t{left:88%;bottom:64px}
.sh.t2{left:46%;bottom:92px;border-bottom-color:#55A8FF;border-left-width:11px;border-right-width:11px;border-bottom-width:19px}
.sh.s{left:70%;bottom:70px;width:22px;height:22px;border:3px solid #35E8A2;transform:rotate(18deg)}
.sh.s2{left:22%;bottom:104px;width:16px;height:16px;border:3px solid #B284FF;transform:rotate(-14deg)}
.sh.c{left:32%;bottom:58px;width:20px;height:20px;border-radius:50%;background:rgba(255,96,117,.7)}
.sh.c2{left:92%;bottom:96px;width:14px;height:14px;border-radius:50%;background:rgba(124,231,255,.8)}
@keyframes scrolly{from{transform:translateX(0)}to{transform:translateX(-88%)}}
.scRunner{position:absolute;bottom:34px;left:18%;width:110px;animation:runBob .5s ease-in-out infinite alternate}
.runner{width:100%;height:auto;filter:drop-shadow(0 8px 10px rgba(0,0,0,.35))}
.r-legs path{animation:legSw .5s ease-in-out infinite alternate}
.r-arms path{animation:armSw .5s ease-in-out infinite alternate}
@keyframes legSw{from{transform:rotate(-16deg);transform-origin:50px 76px}to{transform:rotate(16deg);transform-origin:50px 76px}}
@keyframes armSw{from{transform:rotate(10deg);transform-origin:50px 50px}to{transform:rotate(-10deg);transform-origin:50px 50px}}
@keyframes runBob{from{transform:translateY(0)}to{transform:translateY(-7px)}}
.scDust i{position:absolute;bottom:-6px;left:-14px;width:10px;height:10px;border-radius:50%;
  background:rgba(200,215,255,.5);animation:dust 1.1s linear infinite}
.scDust i:nth-child(2){animation-delay:.35s}
.scDust i:nth-child(3){animation-delay:.7s}
@keyframes dust{from{transform:translate(0,0) scale(.6);opacity:.8}to{transform:translate(-60px,-16px) scale(1.6);opacity:0}}
.scHearts{position:absolute;inset:0;pointer-events:none}
.scHeart{position:absolute;left:20%;bottom:20px;color:#FF6A8B;font-size:22px;opacity:0;
  animation:heartRise 2.6s ease-in infinite;animation-delay:calc(var(--i)*.5s)}
@keyframes heartRise{
  0%{opacity:0;transform:translate(0,0) scale(.6)}
  15%{opacity:1}
  100%{opacity:0;transform:translate(120px,-170px) scale(1.2)}
}
.scene-sky .scHeart{left:calc(14% + var(--i)*7%)}
.scRow{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;margin:16px 0}
.scItem{display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--panel-hi);
  border:2px solid var(--edge);border-radius:18px;padding:14px 18px;min-width:150px;animation:pop .5s both}
.scItem span{font-weight:900;font-size:14px}
.scItem b{font-family:var(--font-display);font-size:30px;line-height:1.15;color:var(--gold);display:block}
.scItem .big-heart{margin-bottom:2px}
.scItem small{color:var(--soft);font-size:12.5px;font-weight:700}
.big-heart{display:block;width:64px;height:64px}
.big-heart svg{width:100%;height:100%}
.result-strip{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin:14px 0 0}
.rs-item{display:flex;align-items:center;gap:8px;background:var(--panel-hi);border:2px solid var(--edge);
  border-radius:14px;padding:8px 14px;font-weight:900}
.rs-item b{font-family:var(--font-display);font-size:20px}

/* ---------- 9) الشهادة ---------- */
.cert-wrap{padding:14px}
.cert{background:linear-gradient(160deg,#121C46,#0A1233);border:3px solid var(--gold);border-radius:20px;padding:6px}
html[data-theme="light"] .cert{border-color:#D6A200}
.cert-in{border:2px dashed rgba(255,201,60,.5);border-radius:16px;padding:22px 18px;text-align:center}
.cert-head{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:6px}
.cert-logo{width:38px;height:38px}
.cert-k{font-family:var(--font-display);font-size:20px;color:var(--gold);margin:0}
.cert-k2{font-size:13px;color:var(--soft);margin:0;font-weight:800}
.cert-t{font-family:var(--font-display);font-size:clamp(26px,5vw,38px);margin:6px 0 10px;color:var(--gold)}
.cert-p{margin:4px 0;color:var(--soft);font-weight:700}
.cert-name{font-family:var(--font-display);font-size:clamp(26px,6vw,42px);margin:10px 0;color:#fff;
  border-bottom:3px solid var(--gold);display:inline-block;padding:0 18px 6px}
html[data-theme="light"] .cert-name{color:#111A36}
.cert-stats{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:16px 0}
.cert-stats div{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.18);border-radius:14px;padding:8px 16px;min-width:110px}
html[data-theme="light"] .cert-stats div{background:rgba(20,40,110,.05);border-color:rgba(20,40,110,.15)}
.cert-stats b{display:block;font-family:var(--font-display);font-size:24px;color:var(--gold)}
.cert-stats span{font-size:12px;color:var(--soft);font-weight:800}
.cert-badges{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.certBadge{display:flex;flex-direction:column;align-items:center;gap:2px}
.certBadge small{font-size:11px;color:var(--soft);font-weight:800;line-height:1.4}
.cert-foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--soft);
  border-top:1px solid rgba(255,255,255,.15);padding-top:10px;margin-top:8px;font-weight:800}

/* ---------- 10) لوحة المتصدرين ---------- */
.podiumwrap{display:flex;gap:12px;justify-content:center;align-items:flex-end;flex-wrap:wrap;margin:12px 0 18px}
.podium{display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--panel-hi);
  border:2px solid var(--edge);border-radius:16px;padding:12px 16px;min-width:120px}
.podium.p1{border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,201,60,.2);order:2}
.podium.p2{order:1}.podium.p3{order:3}
.podium b{font-family:var(--font-display);font-size:17px}
.podium span{font-size:13px;font-weight:800;color:var(--soft)}
.podium em{font-size:12.5px;font-weight:900;color:#FF9AB0;font-style:normal}
.boardstats{display:flex;gap:14px;flex-wrap:wrap;font-weight:900;font-size:14px;color:var(--soft);margin-bottom:10px}
.boardt td,.boardt th{white-space:nowrap}
.boardt .rkcell{width:60px}
.boardt .nmcell{display:flex;align-items:center;text-align:start;white-space:normal}
.nmtxt{display:flex;flex-direction:column;line-height:1.35}
.nmtxt .sub{font-size:11.5px;color:var(--soft);font-weight:800}
.bdPill{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--edge);border-radius:999px;
  padding:2px 8px;margin-inline-end:5px;font-size:11px;font-weight:900}
.bdPill i{font-style:normal}

/* ---------- 11) المعلم ---------- */
.tlogin{display:flex;flex-direction:column;gap:10px;max-width:420px;margin-top:14px}
.tlogin label{font-weight:900;font-size:14px}
.tlogin input{background:var(--panel-hi);border:2px solid var(--edge);border-radius:12px;padding:11px 14px;
  color:var(--ink);font-size:17px;font-weight:700}
.filters{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin:12px 0}
.filters label{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:900;color:var(--soft)}
.filters select,.filters input{background:var(--panel-hi);border:2px solid var(--edge);border-radius:11px;
  padding:8px 10px;color:var(--ink);font-weight:800;font-size:14.5px;min-width:150px}
.fsearch input{min-width:210px}
.fauth{flex-direction:row;align-items:center;gap:8px}
.kpi{animation:pop .35s both}
.kpi b{white-space:nowrap}
.kpi span,.kpi em{white-space:normal}
.pfHead{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.pfHead b{font-family:var(--font-display);font-size:20px}
.pfHead p{margin:2px 0}
.pfHearts{margin-inline-start:auto;display:flex;align-items:center;gap:7px;background:rgba(224,36,94,.12);
  border:2px solid rgba(255,96,117,.35);border-radius:14px;padding:6px 14px;font-weight:900}
.pfHearts b{font-size:22px;color:#FF9AB0}

/* ---------- 12) حركات الأسئلة والخيارات ---------- */
.screen.enter .qtext{animation:qIn .4s cubic-bezier(.2,.8,.2,1) both}
@keyframes qIn{from{opacity:0;transform:translateY(12px) scale(.99)}to{opacity:1;transform:none}}
.screen.enter .opt,.screen.enter .tfb{animation:optIn .34s ease both}
.screen.enter .opt:nth-child(1),.screen.enter .tfb:nth-child(1){animation-delay:.04s}
.screen.enter .opt:nth-child(2),.screen.enter .tfb:nth-child(2){animation-delay:.10s}
.screen.enter .opt:nth-child(3){animation-delay:.16s}
.screen.enter .opt:nth-child(4){animation-delay:.22s}
@keyframes optIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.opt.right,.tfb.right{box-shadow:0 0 0 3px rgba(53,232,162,.45),0 0 22px rgba(53,232,162,.35) inset}
.opt.wrong,.tfb.wrong{box-shadow:0 0 0 3px rgba(255,96,117,.45)}
.fb.ok{animation:okPop .45s cubic-bezier(.2,1.4,.4,1) both}
.fb.no{animation:noShake .4s ease both}
@keyframes okPop{0%{transform:scale(.94);opacity:.4}100%{transform:scale(1);opacity:1}}
@keyframes noShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.dots .dot{transition:background .25s ease,transform .25s ease}
.dots .dot.cur{animation:dotPulse 1.6s ease-in-out infinite}
@keyframes dotPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.35)}}
.hud-score b{transition:color .2s ease}

/* شارة القلوب المتحركة عند الإجابة الصحيحة */
.plus{animation:pop .5s both,floatUp .9s ease .3s both}
@keyframes floatUp{to{transform:translateY(-10px);opacity:.9}}

/* ---------- 13) استجابة الشاشات الصغيرة ---------- */
@media (max-width:560px){
  .heartpill{padding:4px 10px 4px 8px;font-size:14px}
  .heartpill b{font-size:17px}
  .hrt{width:19px;height:19px}
  .nav{gap:4px}
  .nbtn{font-size:11px;padding:5px 2px}
  .nbtn .ni{width:19px;height:19px}
  .who{display:none}
  .mapcard{flex-direction:column}
  .scRow{gap:10px}
  .scItem{min-width:120px;padding:10px 12px}
  .cert-in{padding:16px 10px}
  .filters label{flex:1 1 100%}
  .filters select,.filters input{width:100%}
}

/* ---------- 14) تقليل الحركة ---------- */
.no-motion *{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){
  .sh,.scShapes,.scRunner,.scHeart,.r-legs path,.r-arms path,.scDust i{animation:none!important}
}

/* ---------- 15) الطباعة: الشهادة ---------- */
@media print{
  body{background:#fff!important;color:#000!important;padding:0}
  .navwrap,.no-print,#toast,.heartpill,.theme-btn{display:none!important}
  .cert{background:#fff!important;border-color:#B8860B!important;color:#111;break-inside:avoid}
  .cert-name,.cert-t{color:#8A6200!important}
  .cert-p,.cert-stats span,.cert-foot,.certBadge small{color:#333!important}
  .cert-stats div{border-color:#ccc!important;background:#fafafa!important}
  .cert-stats b{color:#8A6200!important}
  .card{border:0;box-shadow:none;padding:0}
}

}

/* ---------- نظام القلوب: مكافأة مستقلة عن النقاط ----------
   القلوب تُحسب من سجل الإجابات نفسه: ١٠ قلوب لكل سؤال يُجاب عنه إجابة صحيحة أول مرة،
   + ٢٥ قلبًا عند إتمام مختبر المثلثات في كل مستوى (مرة واحدة فقط لكل مستوى).
   لأن الحساب مشتق من سجل الإجابات، يستحيل احتساب المكافأة مرتين حتى لو ضغط الطالب أكثر من مرة. */
var HEART_PER_Q=10,HEART_PER_LAB=25;
function heartsOf(r){
  var seen={},qc=0,lc=0;
  ((r&&r.runs)||[]).forEach(function(u){
    (u.a||[]).forEach(function(a){if(a.ok&&!seen[a.q]){seen[a.q]=1;qc++;}});
  });
  if(r&&r.labs){[0,1,2].forEach(function(l){if(r.labs[l]&&r.labs[l].done)lc++;});}
  return {nq:qc,nlab:lc,questions:qc*HEART_PER_Q,labs:lc*HEART_PER_LAB,total:qc*HEART_PER_Q+lc*HEART_PER_LAB};
}

/* ---------- derived values (never stored, always recomputed from the real answers) ---------- */
function runCorrect(u){var c=0;u.a.forEach(function(x){if(x.ok)c++;});return c;}
function derive(r){
  var best=[0,0,0],fin=[0,0,0],att=[0,0,0],ans=0,ok=0,reached=-1,last=[null,null,null],lastT=[0,0,0];
  r.runs.forEach(function(u){
    if(!u.a.length)return;
    att[u.lv]++;ans+=u.a.length;var c=runCorrect(u);ok+=c;
    if(u.lv>reached)reached=u.lv;
    if(u.t1){fin[u.lv]++;if(c*10>best[u.lv])best[u.lv]=c*10;if(u.t1>=lastT[u.lv]){lastT[u.lv]=u.t1;last[u.lv]=c*10;}}
  });
  var passed=[0,1,2].map(function(l){return fin[l]>0&&best[l]>=PASS_MARK*10;});
  var tiers=[0,1,2].map(function(l){return fin[l]>0?tierOf(best[l]/10):null;});
  var np=passed.filter(Boolean).length,un=passed.indexOf(false);
  var H=heartsOf(r);
  return {best:best,fin:fin,att:att,last:last,passed:passed,tiers:tiers,ans:ans,ok:ok,wrong:ans-ok,reached:reached,nPassed:np,
    total:best[0]+best[1]+best[2],completed:np===3,unlocked:un<0?2:un,
    attempts:att[0]+att[1]+att[2],
    hearts:H.total,heartsQ:H.questions,heartsLab:H.labs,nHeartsQ:H.nq,nLabs:H.nlab,
    labs:(r.labs||{}),labOf:function(l){return (r.labs||{})[l]||null;}};
}
function boardOf(r){var d=derive(r);return {id:r.id,name:r.name,total:d.total,best:d.best,passed:d.passed,tiers:d.tiers,done:d.nPassed,
  hearts:d.hearts,av:r.av||'',sex:r.sex||'',labs:d.nLabs,createdAt:r.createdAt||0,ts:Date.now()};}

/* ---------- saving: automatic, one write at a time, local mirror always kept ---------- */
var wq={busy:false,dirty:false};
function persist(){
  var r=S.rec;if(!r)return;
  r.updatedAt=Date.now();
  var all=LS.get(RK)||{};all[r.id]=r;LS.set(RK,all);   /* device copy (also the offline safety net) */
  if(Store.mode==='db'||Store.mode==='api'){wq.dirty=true;if(!wq.busy)flush();}
}
async function flush(){
  wq.busy=true;
  while(wq.dirty){
    wq.dirty=false;
    var r=S.rec;
    if(!r||!r.id){break;}
    try{
      if(Store.mode==='api'){
        await window.THAPI.save(clone(r));
      }else{
        await Store.db.doc('students/'+r.id).set(clone(r));
        await Store.db.doc('board/'+r.id).set(boardOf(r));
      }
      Store.err=null;
    }catch(e){Store.err=e;break;}
  }
  wq.busy=false;listeners.sync();
}

  if(Store.mode==='local')return 'تُحفظ نتيجتك على هذا الجهاز فقط، ولن تظهر للمعلم إلا إذا فتحت اللعبة بحسابك على المنصة.';
  if(Store.err)return 'تعذر إرسال آخر إجابة للمعلم. تقدمك محفوظ على جهازك وسيُعاد الإرسال مع الإجابة التالية.';

/* ---------- analytics: every number below is computed from the recorded answers ---------- */
function mean(a){var s=0,i;for(i=0;i<a.length;i++)s+=a[i];return a.length?s/a.length:0;}
function r1(x){return Math.round(x*10)/10;}
function pc(a,b){return b?r1(a*100/b):0;}
function P(x){return n(r1(x))+'٪';}
function statusOf(p,cnt,min){
  if(cnt<min)return 'none';
  return p>=TH.master?'good':(p>=TH.weak?'mid':'weak');
}
var ST={good:'أتقنها الطلاب',mid:'تحتاج إلى تعزيز',weak:'صعوبة واضحة',none:'بيانات غير كافية'};
function fmtDT(ms){
  if(!ms)return '—';
  try{return new Date(ms).toLocaleString('ar-EG',{year:'numeric',month:'numeric',day:'numeric',hour:'numeric',minute:'2-digit'});}
  catch(e){return String(new Date(ms));}
}
function fmtDTcsv(ms){
  if(!ms)return '';var d=new Date(ms);function z(x){return (x<10?'0':'')+x;}
  return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())+' '+z(d.getHours())+':'+z(d.getMinutes());
}
function tierBin(p){return p>=90?'green':p>=70?'yellow':p>=50?'red':'gray';}

function analyze(F){
  var recs=allRecs();
  if(F.sid&&F.sid!=='all')recs=recs.filter(function(r){return r.id===F.sid;});
  if(F.q){var qq=String(F.q).trim().toLowerCase();if(qq)recs=recs.filter(function(r){return String(r.name||'').toLowerCase().indexOf(qq)>=0;});}
  if(F.from)recs=recs.filter(function(r){return (r.updatedAt||r.createdAt||0)>=F.from;});
  if(F.to)recs=recs.filter(function(r){return (r.updatedAt||r.createdAt||0)<=F.to;});
  var D=recs.map(function(r){return {r:r,d:derive(r)};});
  var rowsAll=[];
  recs.forEach(function(r){
    var seen={};
    r.runs.forEach(function(u){
      if(!u.a.length)return;
      u.a.forEach(function(a){
        var k=u.id+'|'+a.q;if(seen[k])return;seen[k]=1;       /* never count the same answer twice */
        rowsAll.push({sid:r.id,name:r.name,lv:u.lv,att:u.att,run:u.id,q:a.q,ok:a.ok,ch:a.ch,t:a.t,fin:!!u.t1});
      });
    });
  });
  var rows=F.lv?rowsAll.filter(function(x){return x.lv===F.lv-1;}):rowsAll;
  var lvls=F.lv?[F.lv-1]:[0,1,2];
  var pairs=[],attPairs=[];
  D.forEach(function(x){lvls.forEach(function(l){
    if(x.d.att[l]>0)attPairs.push(x.d.att[l]);
    if(x.d.fin[l]>0)pairs.push({sid:x.r.id,name:x.r.name,l:l,best:x.d.best[l]});
  });});
  var sc=D.map(function(x){
    var v=lvls.filter(function(l){return x.d.fin[l]>0;}).map(function(l){return x.d.best[l];});
    return v.length?mean(v):null;
  });
  var scored=[];D.forEach(function(x,i){if(sc[i]!==null)scored.push({name:x.r.name,id:x.r.id,v:sc[i]});});
  scored.sort(function(a,b){return b.v-a.v;});
  var A={F:F,D:D,rows:rows,rowsAll:rowsAll,scored:scored};
  A.total=D.length;
  A.completed=D.filter(function(x){return F.lv?x.d.passed[F.lv-1]:x.d.completed;}).length;
  A.notCompleted=A.total-A.completed;
  A.avg=scored.length?mean(scored.map(function(s){return s.v;})):null;
  A.hi=scored.length?scored[0]:null;A.lo=scored.length?scored[scored.length-1]:null;
  A.pass=pairs.length?pc(pairs.filter(function(p){return p.best>=PASS_MARK*10;}).length,pairs.length):null;
  A.mast=pairs.length?pc(pairs.filter(function(p){return p.best>=TH.master;}).length,pairs.length):null;
  A.pairs=pairs.length;
  A.avgAtt=attPairs.length?r1(mean(attPairs)):null;
  A.tiers={gray:0,red:0,yellow:0,green:0};
  A.hearts=D.reduce(function(s,x){return s+x.d.hearts;},0);
  A.started=D.filter(function(x){return x.d.ans>0;}).length;
  A.notStarted=D.filter(function(x){return x.d.ans===0;}).length;
  A.labDone=D.filter(function(x){return x.d.nLabs>0;}).length;
  A.labTotal=D.reduce(function(s,x){return s+x.d.nLabs;},0);
  A.avgHearts=D.length?r1(mean(D.map(function(x){return x.d.hearts;}))):null;
  A.retried=[0,1,2].map(function(l){return D.filter(function(x){return x.d.att[l]>1;}).length;});
  scored.forEach(function(s){A.tiers[tierBin(s.v)]++;});
  A.bins=[0,0,0,0,0];
  scored.forEach(function(s){A.bins[Math.min(4,Math.floor(s.v/20))]++;});
  /* per level (always the three levels) */
  A.lvl=[0,1,2].map(function(l){
    var rr=rowsAll.filter(function(x){return x.lv===l;});
    var ok=rr.filter(function(x){return x.ok;}).length;
    var bs=[];D.forEach(function(x){if(x.d.fin[l]>0)bs.push(x.d.best[l]);});
    var retried=D.filter(function(x){return x.d.att[l]>1;}).length;
    var moved=D.filter(function(x){return x.d.passed[l]&&l<2;}).length;
    var attempts=D.reduce(function(s2,x){return s2+x.d.att[l];},0);
    return {n:bs.length,ok:ok,wrong:rr.length-ok,avg:bs.length?mean(bs):null,retried:retried,moved:moved,tries:attempts,
      mast:bs.length?pc(bs.filter(function(b){return b>=TH.master;}).length,bs.length):null,
      pass:bs.length?pc(bs.filter(function(b){return b>=PASS_MARK*10;}).length,bs.length):null,
      moved:null,retried:0};
  });
  /* questions */
  var qm={};
  QS.forEach(function(q){qm[q.id]={q:q,n:0,ok:0,wrong:0,stu:{},wst:{},wch:{}};});
  rows.forEach(function(x){
    var m=qm[x.q];if(!m)return;
    m.n++;m.stu[x.sid]=1;
    if(x.ok)m.ok++;else{m.wrong++;m.wst[x.sid]=x.name;var k=String(x.ch);m.wch[k]=(m.wch[k]||0)+1;}
  });
  A.qs=QS.map(function(q){
    var m=qm[q.id];m.ns=Object.keys(m.stu).length;m.nw=Object.keys(m.wst).length;
    m.err=m.n?pc(m.wrong,m.n):null;m.corr=m.n?pc(m.ok,m.n):null;
    m.enough=m.n>=3&&m.ns>=2;
    m.redo=m.enough&&m.err>=TH.hard;
    m.names=Object.keys(m.wst).map(function(k){return m.wst[k];});
    m.wlist=Object.keys(m.wch).map(function(k){return {ch:k,c:m.wch[k]};}).sort(function(a,b){return b.c-a.c;});
    return m;
  });
  /* concepts */
  A.con=CK.map(function(k){
    var rr=rows.filter(function(x){return QC[x.q]===k;});
    var ok=rr.filter(function(x){return x.ok;}).length;
    var stu={},wst={};rr.forEach(function(x){stu[x.sid]=1;if(!x.ok)wst[x.sid]=x.name;});
    var ns=Object.keys(stu).length;
    var st=statusOf(pc(ok,rr.length),rr.length,TH.minAnswers);
    if(ns<TH.minStudents)st='none';
    return {k:k,n:rr.length,ok:ok,wrong:rr.length-ok,p:rr.length?pc(ok,rr.length):null,ns:ns,nw:Object.keys(wst).length,wnames:Object.keys(wst).map(function(x){return wst[x];}),st:st};
  });
  /* alerts: a concept weak for a noticeable number of students */
  A.alerts=A.con.filter(function(c){return c.st==='weak'&&c.nw>=Math.max(2,Math.ceil(c.ns*0.25));});
  /* first vs last finished attempt, per student and level */
  A.ba=[0,1,2].map(function(l){
    var f=[],s=[];
    recs.forEach(function(r){
      var fr=r.runs.filter(function(u){return u.lv===l&&u.t1&&u.a.length;}).sort(function(a,b){return a.t1-b.t1;});
      if(fr.length>=2){f.push(runCorrect(fr[0])*10);s.push(runCorrect(fr[fr.length-1])*10);}
    });
    return {n:f.length,first:f.length?mean(f):null,last:s.length?mean(s):null,up:s.filter(function(v,i){return v>f[i];}).length};
  });
  return A;
}
function enoughClass(A){return A.total>=TH.minStudents&&A.rows.length>=TH.minAnswers;}
function lvName(l){return LV[l].name;}

/* ---------- executive summary and priorities (text built only from the data) ---------- */
function priorities(A){
  var list=A.con.filter(function(c){return c.st==='weak'||c.st==='mid';}).sort(function(a,b){return a.p-b.p;});
  return list.slice(0,3);
}
function execSummary(A){
  var out=[];
  if(!A.total){return ['لا توجد بيانات بعد: لم يدخل أي طالب اللعبة.'];}
  out.push('دخل اللعبة '+n(A.total)+' طالبًا، أكمل منهم '+n(A.completed)+' واجتازوا المستويات'+(A.F.lv?' المحددة':' الثلاثة')+'، ولم يكمل '+n(A.notCompleted)+'.');
  if(A.avg!==null){out.push('متوسط الأداء '+P(A.avg)+'، ونسبة النجاح '+P(A.pass)+'، ونسبة الإتقان (٨ من ١٠ فأكثر) '+P(A.mast)+'.');}
  else out.push('لم يُكمل أي طالب مستوى كاملًا بعد، لذلك لا تُحسب متوسطات الدرجات.');
  if(!enoughClass(A)){
    out.push('البيانات غير كافية لتحليل تربوي موثوق: يلزم '+n(TH.minStudents)+' طلاب و'+n(TH.minAnswers)+' إجابات على الأقل. الأرقام أعلاه صحيحة لكنها تخص عددًا محدودًا.');
    return out;
  }
  var known=A.con.filter(function(c){return c.st!=='none';}).sort(function(a,b){return a.p-b.p;});
  if(known.length){
    var w=known[0],g=known[known.length-1];
    if(w.st==='weak'||w.st==='mid')out.push('أضعف مفهوم: «'+CON[w.k].n+'» بنسبة إجابات صحيحة '+P(w.p)+'.');
    if(g.k!==w.k&&g.st==='good')out.push('أقوى مفهوم: «'+CON[g.k].n+'» بنسبة '+P(g.p)+'.');
  }
  var hard=A.qs.filter(function(m){return m.enough;}).sort(function(a,b){return b.err-a.err||b.n-a.n;})[0];
  if(hard&&hard.err>0)out.push('أصعب سؤال: «'+hard.q.txt+'» ('+qTag(hard.q)+') ونسبة الخطأ فيه '+P(hard.err)+'.');
  var pr=priorities(A);
  if(pr.length)out.push('أولويات الدرس القادم: '+pr.map(function(c,i){return n(i+1)+') '+CON[c.k].s;}).join('، ')+'.');
  else out.push('لا توجد مفاهيم ضعيفة بحسب البيانات الحالية. يمكن الانتقال إلى موضوع جديد مع مراجعة خفيفة.');
  return out;
}

/* ---------- one student: the personal file ---------- */
function studentModel(r){
  var d=derive(r),rows=[];
  r.runs.forEach(function(u){if(!u.a.length)return;u.a.forEach(function(a){rows.push({lv:u.lv,att:u.att,q:a.q,ok:a.ok,ch:a.ch,t:a.t,run:u.id,fin:!!u.t1});});});
  var M={r:r,d:d,rows:rows};
  M.distinct={};rows.forEach(function(x){M.distinct[x.q]=1;});
  M.nDistinct=Object.keys(M.distinct).length;
  M.levels=[0,1,2].map(function(l){
    var rr=rows.filter(function(x){return x.lv===l;});
    var ok=rr.filter(function(x){return x.ok;}).length;
    return {l:l,att:d.att[l],fin:d.fin[l],best:d.fin[l]?d.best[l]:null,last:d.last[l],ok:ok,wrong:rr.length-ok,tier:d.tiers[l]};
  });
  var fl=M.levels.filter(function(x){return x.fin>0;});
  M.pct=fl.length?mean(fl.map(function(x){return x.best;})):null;
  M.con=CK.map(function(k){
    var rr=rows.filter(function(x){return QC[x.q]===k;}),ok=rr.filter(function(x){return x.ok;}).length;
    var p=rr.length?pc(ok,rr.length):null;
    return {k:k,n:rr.length,ok:ok,p:p,st:statusOf(p,rr.length,2)};
  });
  var mm={};
  rows.forEach(function(x){if(x.ok)return;var m=mm[x.q]||(mm[x.q]={q:QI[x.q],times:0,ch:null});m.times++;m.ch=x.ch;});
  M.missed=Object.keys(mm).map(function(k){return mm[k];}).sort(function(a,b){return a.q.k-b.q.k;});
  M.strong=M.con.filter(function(c){return c.st==='good';});
  M.review=M.con.filter(function(c){return c.st==='weak';});
  M.reinforce=M.con.filter(function(c){return c.st==='mid';});
  M.recs=[];
  M.review.concat(M.reinforce).forEach(function(c){M.recs.push('راجع «'+CON[c.k].n+'»: '+CON[c.k].tip);});
  if(!M.rows.length)M.recs=[];
  else if(!M.recs.length)M.recs.push('مستواك ممتاز في كل المفاهيم التي أجبت عنها. حاول رفع درجتك في أي مستوى إلى ١٠٠ نقطة.');
  return M;
}

/* ---------- CSV (UTF-8 with BOM so Excel shows Arabic correctly) ---------- */
function csvCell(v){var s=(v===null||v===undefined)?'':String(v);return /[",\n\r]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;}
function csvOf(head,rows){return '﻿'+[head].concat(rows).map(function(r){return r.map(csvCell).join(',');}).join('\r\n');}
function csvStudents(A){
  var rows=A.D.map(function(x){

}

/* ---------- charts: small SVG renderers, drawn to scale, RTL (first category on the right) ---------- */
function tipAttr(t){return ' data-tip="'+esc(t)+'" tabindex="0"';}
function niceMax(m){if(m<=5)return 5;if(m<=10)return 10;var p=Math.pow(10,Math.floor(Math.log(m)/Math.LN10)),f=m/p;return (f<=1?1:f<=2?2:f<=5?5:10)*p;}
function noData(msg){return '<p class="nodata">'+(msg||'لا توجد بيانات كافية لعرض هذا الرسم بعد.')+'</p>';}
function legend(items){return '<div class="lgd">'+items.map(function(i){return '<span><i style="background:'+i.c+'"></i>'+i.n+'</span>';}).join('')+'</div>';}

function vbars(o){
  var W=560,H=260,L=40,R=14,T=22,B=48,iw=W-L-R,ih=H-T-B,k=o.cats.length,sl=iw/k,i,s,out='';
  var mxv=0;
  o.cats.forEach(function(c,j){
    if(o.stacked){mxv=Math.max(mxv,o.series.reduce(function(a,x){return a+(x.v[j]||0);},0));}
    else o.series.forEach(function(x){mxv=Math.max(mxv,x.v[j]||0);});
  });
  var mx=o.max||niceMax(mxv);
  if(!mx)mx=5;
  var y=function(v){return T+ih-(v/mx)*ih;};
  for(i=0;i<=4;i++){var gv=mx*i/4;out+='<line class="gl" x1="'+L+'" x2="'+(W-R)+'" y1="'+y(gv)+'" y2="'+y(gv)+'"/><text class="ax" x="'+(L-6)+'" y="'+(y(gv)+4)+'" text-anchor="end">'+n(r1(gv))+(o.unit||'')+'</text>';}
  o.cats.forEach(function(c,j){
    var cx=W-R-sl*(j+0.5);
    out+='<text class="ax cat" x="'+cx+'" y="'+(H-B+20)+'" text-anchor="middle">'+esc(c.l)+'</text>';
    if(o.stacked){
      var bw=Math.min(70,sl*0.5),acc=0;
      o.series.forEach(function(sr){
        var v=sr.v[j]||0;if(!v)return;
        var y0=y(acc+v),h=y(acc)-y0;
        out+='<rect x="'+(cx-bw/2)+'" y="'+y0+'" width="'+bw+'" height="'+h+'" rx="4" fill="'+sr.c+'"'+tipAttr(c.l+' · '+sr.n+': '+n(v))+'/>';
        if(h>16)out+='<text class="vl" x="'+cx+'" y="'+(y0+h/2+5)+'" text-anchor="middle">'+n(v)+'</text>';
        acc+=v;
      });
    }else{
      var m=o.series.length,gw=Math.min(sl*0.7,m*60),bw2=gw/m;
      o.series.forEach(function(sr,si){
        var v=sr.v[j];if(v===null||v===undefined)return;
        var x0=cx+gw/2-(si+1)*bw2+3,h2=(v/mx)*ih;
        out+='<rect x="'+x0+'" y="'+(T+ih-h2)+'" width="'+(bw2-6)+'" height="'+Math.max(h2,1)+'" rx="4" fill="'+(sr.cc?sr.cc[j]:sr.c)+'"'+tipAttr(c.l+(m>1?' · '+sr.n:'')+': '+n(r1(v))+(o.unit||''))+'/>';
        out+='<text class="vl out" x="'+(x0+(bw2-6)/2)+'" y="'+(T+ih-h2-5)+'" text-anchor="middle">'+n(r1(v))+(o.unit||'')+'</text>';
      });
    }
  });
  return '<svg class="ch" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(o.label||'رسم بياني')+'">'+out+'</svg>';
}

function hbars(o){
  var W=560,LW=200,RW=14,rh=30,n0=o.items.length,H=Math.max(60,n0*rh+10),bw=W-LW-RW-44,out='',mx=o.max||100;
  o.items.forEach(function(it,j){
    var yy=5+j*rh,len=(Math.max(0,it.v)/mx)*bw;
    out+='<text class="ax" x="'+(W-6)+'" y="'+(yy+19)+'" text-anchor="end"'+(it.me?' font-weight="900"':'')+'>'+esc(it.l.length>30?it.l.slice(0,29)+'…':it.l)+'</text>';
    out+='<rect x="'+(W-LW-bw)+'" y="'+(yy+3)+'" width="'+bw+'" height="'+(rh-10)+'" rx="5" class="trk"/>';
    out+='<rect x="'+(W-LW-len)+'" y="'+(yy+3)+'" width="'+Math.max(len,2)+'" height="'+(rh-10)+'" rx="5" fill="'+it.c+'"'+tipAttr(it.tip||(it.l+': '+n(r1(it.v))+(o.unit||'')))+'/>';
    out+='<text class="vl out" x="'+(W-LW-bw-6)+'" y="'+(yy+19)+'" text-anchor="end">'+n(r1(it.v))+(o.unit||'')+'</text>';
  });
  return '<svg class="ch" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(o.label||'رسم بياني')+'">'+out+'</svg>';
}

function lineChart(o){
  var W=560,H=260,L=40,R=30,T=22,B=48,iw=W-L-R,ih=H-T-B,k=o.cats.length,mx=o.max||100,out='',i;
  var y=function(v){return T+ih-(v/mx)*ih;};
  var xs=function(j){return W-R-(k===1?iw/2:iw*j/(k-1));};
  for(i=0;i<=4;i++){var g=mx*i/4;out+='<line class="gl" x1="'+L+'" x2="'+(W-R)+'" y1="'+y(g)+'" y2="'+y(g)+'"/><text class="ax" x="'+(L-6)+'" y="'+(y(g)+4)+'" text-anchor="end">'+n(r1(g))+'</text>';}
  o.cats.forEach(function(c,j){out+='<text class="ax cat" x="'+xs(j)+'" y="'+(H-B+20)+'" text-anchor="middle">'+esc(c)+'</text>';});
  o.series.forEach(function(sr){
    var pts=[];sr.v.forEach(function(v,j){if(v!==null&&v!==undefined)pts.push([xs(j),y(v),v,j]);});
    if(pts.length>1)out+='<polyline fill="none" stroke="'+sr.c+'" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"'+(sr.dash?' stroke-dasharray="7 6"':'')+' points="'+pts.map(function(p){return p[0]+','+p[1];}).join(' ')+'"/>';
    pts.forEach(function(p){
      out+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="7" fill="'+sr.c+'" stroke="var(--bg)" stroke-width="2.5"'+tipAttr(sr.n+' · '+o.cats[p[3]]+': '+n(r1(p[2]))+'٪')+'/>';
      if(!sr.dash)out+='<text class="vl out" x="'+p[0]+'" y="'+(p[1]-12)+'" text-anchor="middle">'+n(r1(p[2]))+'</text>';
    });
  });
  return '<svg class="ch" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(o.label||'رسم بياني')+'">'+out+'</svg>';
}

/* floating tooltip (hover, keyboard focus and touch) */
var tipEl=null;
function showTip(t,x,y){
  if(!tipEl)tipEl=document.getElementById('tip');
  if(!tipEl)return;
  tipEl.textContent=t;tipEl.hidden=false;
  var w=tipEl.offsetWidth,vw=document.documentElement.clientWidth;
  var left=Math.min(Math.max(8,x-w/2),vw-w-8);
  tipEl.style.left=left+'px';tipEl.style.top=Math.max(8,y-tipEl.offsetHeight-14)+'px';
}
function hideTip(){if(tipEl)tipEl.hidden=true;}
document.addEventListener('pointerover',function(e){var t=e.target.closest&&e.target.closest('[data-tip]');if(t)showTip(t.getAttribute('data-tip'),e.clientX,e.clientY);});
document.addEventListener('pointermove',function(e){var t=e.target.closest&&e.target.closest('[data-tip]');if(t)showTip(t.getAttribute('data-tip'),e.clientX,e.clientY);else hideTip();});
document.addEventListener('pointerdown',function(e){var t=e.target.closest&&e.target.closest('[data-tip]');if(t)showTip(t.getAttribute('data-tip'),e.clientX,e.clientY);else hideTip();});
document.addEventListener('focusin',function(e){var t=e.target.getAttribute&&e.target.getAttribute('data-tip');if(t){var b=e.target.getBoundingClientRect();showTip(t,b.left+b.width/2,b.top);}});
document.addEventListener('focusout',hideTip);


/* ---------- reports: blocks -> A4 pages drawn on canvas -> real PDF file ---------- */
function loadImg(src){return new Promise(function(res){var i=new Image();i.onload=function(){res(i);};i.onerror=function(){res(null);};i.src=src;});}
async function makePDF(blocks){
  var W=1240,H=1754,M=90,TW=W-2*M,pages=[],cv,cx,y,pg=0;
  try{await document.fonts.load('900 30px Cairo');await document.fonts.load('600 26px Cairo');}catch(e){}
  var FB='Cairo,Tahoma,"Segoe UI",sans-serif',NAVY='#0A1233',INK='#1B2145',GOLD='#9A6B00',SOFT='#EEF1FB',EDGE='#C9D1F0';
  var logos=[await loadImg(IMG.uni),await loadImg(IMG.col)];
  function newPage(){
    cv=document.createElement('canvas');cv.width=W;cv.height=H;cx=cv.getContext('2d');
    cx.fillStyle='#fff';cx.fillRect(0,0,W,H);cx.fillStyle=NAVY;cx.fillRect(0,0,W,16);
    cx.direction='rtl';cx.textBaseline='alphabetic';
    pg++;pages.push(cv);y=M+10;
    if(pg===1){
      var xx=M;logos.forEach(function(im){if(!im)return;var hh=100,ww=im.width*hh/im.height;cx.drawImage(im,xx,y,ww,hh);xx+=ww+30;});
      y+=130;
    }
  }
  function foot(c,i,tot){
    c.direction='rtl';c.textAlign='center';c.fillStyle='#6B7399';c.font='600 20px '+FB;
    c.fillText('رحلة أبطال المثلثات من البرونز إلى الذهب  ·  صفحة '+n(i)+' من '+n(tot),W/2,H-44);
  }
  function font(w,s){cx.font=w+' '+s+'px '+FB;}
  function wrap(t,mw){
    var words=String(t).split(/\s+/),lines=[],cur='';
    words.forEach(function(w){var tr=cur?cur+' '+w:w;if(cx.measureText(tr).width>mw&&cur){lines.push(cur);cur=w;}else cur=tr;});
    if(cur)lines.push(cur);return lines.length?lines:[''];
  }
  function need(h){if(y+h>H-100)newPage();}
  newPage();
  blocks.forEach(function(b){
    cx.textAlign='right';
    if(b.t==='title'){font('900',54);need(80);cx.fillStyle=NAVY;cx.textAlign='center';wrap(b.x,TW).forEach(function(l){cx.fillText(l,W/2,y+50);y+=66;});y+=6;}
    else if(b.t==='sub'){font('700',30);need(50);cx.fillStyle=GOLD;cx.textAlign='center';cx.fillText(b.x,W/2,y+32);y+=54;}
    else if(b.t==='h'){font('900',34);need(90);y+=14;cx.fillStyle='#FFC93C';cx.fillRect(W-M-10,y,10,40);cx.fillStyle=NAVY;cx.fillText(b.x,W-M-26,y+32);y+=62;}
    else if(b.t==='p'){font('600',26);cx.fillStyle=INK;wrap(b.x,TW).forEach(function(l){need(42);cx.fillText(l,W-M,y+30);y+=42;});y+=8;}
    else if(b.t==='ul'){font('600',26);cx.fillStyle=INK;b.items.forEach(function(it){var ls=wrap(it,TW-40);need(42*ls.length);ls.forEach(function(l,k){if(k===0){cx.fillStyle=GOLD;cx.fillText('•',W-M,y+30);cx.fillStyle=INK;}cx.fillText(l,W-M-34,y+30);y+=42;});});y+=8;}
    else if(b.t==='kv'){
      b.rows.forEach(function(r,k){
        font('600',26);var ls=wrap(r[1],TW-340),h=Math.max(1,ls.length)*40+14;need(h);
        cx.fillStyle=k%2?'#fff':SOFT;cx.fillRect(M,y,TW,h);
        cx.fillStyle=GOLD;font('900',24);cx.fillText(r[0],W-M-14,y+34);
        cx.fillStyle=INK;font('700',26);ls.forEach(function(l,j){cx.fillText(l,W-M-340,y+34+j*40);});
        y+=h;
      });y+=14;
    }
    else if(b.t==='table'){
      var tot=b.cols.reduce(function(a,c){return a+c.w;},0),xs=[],acc=W-M;
      b.cols.forEach(function(c){var w=TW*c.w/tot;xs.push([acc,w]);acc-=w;});
      var drawHead=function(){
        need(70);cx.fillStyle=NAVY;cx.fillRect(M,y,TW,52);cx.fillStyle='#fff';font('900',22);
        b.cols.forEach(function(c,i){cx.fillText(c.h,xs[i][0]-10,y+34);});y+=52;
      };
      drawHead();
      b.rows.forEach(function(r,k){
        font('600',22);var cells=r.map(function(v,i){return wrap(v,xs[i][1]-20);});
        var mh=Math.max.apply(null,cells.map(function(c){return c.length;}))*34+16;
        if(y+mh>H-100){newPage();drawHead();font('600',22);}
        cx.fillStyle=k%2?'#fff':SOFT;cx.fillRect(M,y,TW,mh);cx.fillStyle=INK;font('600',22);
        cells.forEach(function(c,i){c.forEach(function(l,j){cx.fillText(l,xs[i][0]-10,y+30+j*34);});});
        cx.strokeStyle=EDGE;cx.lineWidth=1;cx.beginPath();cx.moveTo(M,y+mh);cx.lineTo(W-M,y+mh);cx.stroke();
        y+=mh;
      });
      if(!b.rows.length){need(50);font('600',22);cx.fillStyle=INK;cx.fillText('لا توجد بيانات.',W-M-10,y+34);y+=50;}
      y+=18;
    }
    else if(b.t==='bars'){
      b.items.forEach(function(it){
        need(46);font('700',22);cx.fillStyle=INK;cx.fillText(it.l,W-M,y+28);
        var bx=M+90,bw=TW-420;cx.fillStyle=SOFT;cx.fillRect(bx,y+6,bw,26);
        cx.fillStyle=it.c||'#3B4FA8';var len=bw*Math.max(0,it.v)/100;cx.fillRect(bx+bw-len,y+6,len,26);
        cx.fillStyle=INK;cx.textAlign='left';cx.fillText(n(r1(it.v))+'٪',M,y+28);cx.textAlign='right';
        y+=46;
      });y+=10;
    }
    else if(b.t==='gap'){y+=b.h||20;}
  });
  var imgs=pages.map(function(c,i){foot(c.getContext('2d'),i+1,pages.length);var u=c.toDataURL('image/jpeg',0.9);var bin=atob(u.split(',')[1]),a=new Uint8Array(bin.length),k;for(k=0;k<bin.length;k++)a[k]=bin.charCodeAt(k);return a;});
  return buildPDF(imgs,W,H);
}
function buildPDF(imgs,w,h){
  var enc=new TextEncoder(),parts=[],offs=[],len=0,PW=595.28,PH=841.89,N=imgs.length;
  function push(x){var b=typeof x==='string'?enc.encode(x):x;parts.push(b);len+=b.length;}
  function begin(i){offs[i]=len;push(i+' 0 obj\n');}
  push('%PDF-1.4\n');
  begin(1);push('<< /Type /Catalog /Pages 2 0 R >>\nendobj\n');
  begin(2);push('<< /Type /Pages /Count '+N+' /Kids ['+imgs.map(function(_,k){return (3+3*k)+' 0 R';}).join(' ')+'] >>\nendobj\n');
  imgs.forEach(function(b,k){
    var p=3+3*k,c=4+3*k,im=5+3*k,cs='q '+PW+' 0 0 '+PH+' 0 0 cm /Im0 Do Q';
    begin(p);push('<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+PW+' '+PH+'] /Resources << /XObject << /Im0 '+im+' 0 R >> >> /Contents '+c+' 0 R >>\nendobj\n');
    begin(c);push('<< /Length '+cs.length+' >>\nstream\n'+cs+'\nendstream\nendobj\n');
    begin(im);push('<< /Type /XObject /Subtype /Image /Width '+w+' /Height '+h+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+b.length+' >>\nstream\n');push(b);push('\nendstream\nendobj\n');
  });
  var xr=len,total=3+3*N;
  push('xref\n0 '+total+'\n0000000000 65535 f \n');
  for(var i=1;i<total;i++){push(('0000000000'+offs[i]).slice(-10)+' 00000 n \n');}
  push('trailer\n<< /Size '+total+' /Root 1 0 R >>\nstartxref\n'+xr+'\n%%EOF');
  var out=new Uint8Array(len),pos=0;parts.forEach(function(b){out.set(b,pos);pos+=b.length;});
  return out;
}
function browserDownload(name,data){
  try{
    var blob=(data instanceof Blob)?data:new Blob([data],{type:/\.csv$/i.test(name)?'text/csv;charset=utf-8':'application/octet-stream'});
    var url=URL.createObjectURL(blob),a=document.createElement('a');
    a.href=url;a.download=name;document.body.appendChild(a);a.click();
    setTimeout(function(){URL.revokeObjectURL(url);a.remove();},1500);
    return true;
  }catch(e){return false;}
}
async function saveFile(name,data){
  if(!Store.dl){
    if(browserDownload(name,data)){toast('تم تنزيل الملف: '+name);return true;}
    toast('الحفظ غير متاح في هذا العرض.');return false;
  }
  try{await Store.dl.save({filename:name,data:data});toast('تم تجهيز الملف للحفظ.');return true;}
  catch(e){if(e&&e.code==='declined')return false;toast('تعذر حفظ الملف'+(e&&e.code?' ('+e.code+')':'')+'.');return false;}
}
