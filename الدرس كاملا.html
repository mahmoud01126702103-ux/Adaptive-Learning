var muted=false,ac=null;
function beep(seq){
  if(muted)return;
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    var t=ac.currentTime;
    seq.forEach(function(s){
      var o=ac.createOscillator(),g=ac.createGain();
      o.type='triangle';o.frequency.value=s[0];
      g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.16,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+s[1]);
      o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+s[1]+.03);t+=s[1]*.8;
    });
  }catch(e){}
}
var SND={good:[[659,.12],[880,.2]],bad:[[247,.16],[196,.28]],win:[[523,.12],[659,.12],[784,.12],[1047,.34]],lose:[[330,.18],[262,.18],[196,.3]]};
function confetti(){
  if(reduce)return;
  var c=document.getElementById('fx'),x=c.getContext('2d');
  if(c.__running)return;c.__running=true;
  c.width=window.innerWidth;c.height=window.innerHeight;c.hidden=false;
  var cols=['#FFC93C','#F29A4B','#E3EAF8','#35E8A2','#B284FF','#55A8FF','#FF6075'],P=[],i;
  for(i=0;i<110;i++){P.push({x:Math.random()*c.width,y:-20-Math.random()*c.height*.5,s:8+Math.random()*12,vx:-1.5+Math.random()*3,vy:2+Math.random()*4,r:Math.random()*6,vr:-.2+Math.random()*.4,c:cols[Math.random()*cols.length|0]});}
  var t=0;
  (function f(){
    x.clearRect(0,0,c.width,c.height);
    P.forEach(function(p){
      p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;
      x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;
      x.beginPath();x.moveTo(0,-p.s/1.2);x.lineTo(p.s/1.2,p.s/1.2);x.lineTo(-p.s/1.2,p.s/1.2);x.closePath();x.fill();x.restore();
    });
    if(++t<170){requestAnimationFrame(f);}else{x.clearRect(0,0,c.width,c.height);c.hidden=true;c.__running=false;}
  })();
}

  ids.forEach(function(id){rev[S.pairs[id]]=+id;});

    var p=S.pairs[c.id],cls='mchip concept';

/* ---------- game logic (scoring is unchanged: 10 points per correct answer) ---------- */
async function setupRec(name,av,sex){
  var r=null;
  /* في وضع قاعدة البيانات المشتركة: التسجيل/الاستعادة تُنفَّذ أولًا ليأتي المعرّف من الخادم */
  if(Store.mode==='api'&&window.THAPI&&window.THAPI.register){
    try{
      var reg=await window.THAPI.register(name,av||'',sex||'');
      if(reg&&reg.rec){r=reg.rec;upgradeRec(r);}
      if(reg&&reg.uid)Store.uid=reg.uid;
    }catch(e){Store.err=e;}
  }
  var id=Store.mode!=='local'?Store.uid:localId(name);
  if(!r){
    if(Store.mode!=='local'){r=Store.rec;}
    else{var all=LS.get(RK)||{};r=all[id]||null;}
  }
  if(!r)r=newRec(id,name);
  upgradeRec(r);
  if(!r.id||r.id!==id)r.id=id;
  r.name=name;
  if(av){r.av=av;r.sex=sex||'';}
  S.rec=r;if(Store.mode!=='local')Store.rec=r;
  try{LS.set('th-last',name);}catch(e){}
  persist();
  return r;
}
function startRun(){
  var r=S.rec,att=r.runs.filter(function(u){return u.lv===S.lv&&u.a.length;}).length+1;
  S.cr={id:'r'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),lv:S.lv,att:att,t0:Date.now(),t1:null,a:[]};
  S.run={log:[],right:0};S.qi=0;S.mg=0;S.pairs={};S.sel=null;S.fb=null;go('q');
}
function continueRun(u){
  S.lv=u.lv;S.cr=u;S.run={log:[],right:0};
  u.a.forEach(function(a){var q=QI[a.q],idx=LQ[u.lv].indexOf(q);S.run.log[idx]=logEntry(q,a.ok);if(a.ok)S.run.right++;});
  S.qi=0;S.mg=0;
  if(u.lv===1)S.mg=u.a.length>=5?1:0;else S.qi=u.a.length;
  S.pairs={};S.sel=null;S.fb=null;
  if(u.a.length>=10){finishLevel();return;}
  go('q');
}
function setAns(qid,ok,ch){
  var u=S.cr,r=S.rec;
  if(u.a.some(function(x){return x.q===qid;}))return false;  /* an answer is recorded once */
  var firstRight=ok&&!((r.runs||[]).some(function(x){return x.a.some(function(a){return a.q===qid&&a.ok;});}));
  u.a.push({q:qid,ok:ok?1:0,ch:ch,t:Date.now()});
  if(r.runs.indexOf(u)<0)r.runs.push(u);
  r.cur={run:u.id};
  persist();
  return firstRight?HEART_PER_Q:0;   /* القلوب المستحقة في هذه الإجابة: مرة واحدة لكل سؤال */
}
function answerTF(v){
  if(S.fb)return;
  var q=TF[S.qi],ok=(v===q.a),m=LQ[0][S.qi];
  S.run.log[S.qi]=logEntry(m,ok);
  if(ok)S.run.right++;
  setAns(m.id,ok,v?1:0);
  var earned=setAns(m.id,ok,v?1:0);
  S.fb={ok:ok,chosen:v};beep(ok?SND.good:SND.bad);render();
  if(EXT.onAnswer)EXT.onAnswer({ok:ok,earned:earned});
}
function answerMC(i){
  if(S.fb)return;
  var q=MC[S.qi],ok=(i===q.a),m=LQ[2][S.qi];
  S.run.log[S.qi]=logEntry(m,ok);
  if(ok)S.run.right++;
  var earned2=setAns(m.id,ok,i);
  S.fb={ok:ok,chosen:i};beep(ok?SND.good:SND.bad);render();
  if(EXT.onAnswer)EXT.onAnswer({ok:ok,earned:earned2});
}
function pickC(id){
  if(S.fb)return;
  if(S.pairs[id]){delete S.pairs[id];S.sel=id;}
  else{S.sel=(S.sel===id)?null:id;}
  render();
}
function pickD(l){
  if(S.fb)return;
  var other=null;
  Object.keys(S.pairs).forEach(function(id){if(S.pairs[id]===l)other=id;});
  if(S.sel!==null){
    if(other!==null)delete S.pairs[other];
    S.pairs[S.sel]=l;S.sel=null;
  }else if(other!==null){delete S.pairs[other];}
  render();
}
function checkM(){
  var g=SG[S.mg];
  if(S.fb||Object.keys(S.pairs).length<5)return;
  var res={},okCount=0;
  g.left.forEach(function(c,idx){
    var ok=c.ok.indexOf(S.pairs[c.id])>=0,m=QI['m'+c.id];
    res[c.id]=ok;if(ok){okCount++;S.run.right++;}
    S.run.log[S.mg*5+idx]=logEntry(m,ok);
    setAns(m.id,ok,S.pairs[c.id]);
  });
  S.fb={res:res,okCount:okCount};
  beep(okCount===5?SND.good:(okCount>2?SND.good:SND.bad));render();
  if(EXT.onAnswer)EXT.onAnswer({ok:okCount===5,earned:0,count:okCount});
}
function next(){
  if(!S.fb)return;
  S.fb=null;
  if(S.lv===1){
    if(S.mg===0){S.mg=1;S.pairs={};S.sel=null;render(true);return;}
    finishLevel();return;
  }
  if(S.qi<9){S.qi++;render(true);return;}
  finishLevel();
}
function finishLevel(){
  var r=S.rec,u=S.cr,rr=S.run.right;
  u.t1=Date.now();
  if(r.runs.indexOf(u)<0)r.runs.push(u);
  r.cur=null;persist();
  var t=tierOf(rr);
  if(t==='green'){beep(SND.win);confetti();}
  else if(t==='yellow'){beep(SND.win);}
  else{beep(SND.lose);}
  if(EXT.onFinish)EXT.onFinish({lv:S.lv,right:rr,tier:t});
  go('result');
}

    '<p class="muted">'+((Store.db||Store.mode==='api')?'مصدر البيانات: قاعدة البيانات المشتركة، وتتحدث تلقائيًا. عدد السجلات: '+n(allRecs().length):'مصدر البيانات: هذا الجهاز فقط، لأن قاعدة البيانات المشتركة غير متاحة في هذا العرض.')+'</p>'+

      '<p class="muted small">المعيار: نسبة خطأ '+n(TH.hard)+'٪ فأكثر مع ٣ إجابات على الأقل من طالبين مختلفين.</p>')+'</div>';
  var list=A.qs.slice();

    '<div class="tablewrap"><table class="mini qtab"><thead><tr><th>السؤال</th><th>النص</th><th>الإجابات</th><th>الطلاب</th><th>صحيحة</th><th>خاطئة</th><th>% صحيحة</th><th>% الخطأ</th><th>ملاحظة</th></tr></thead><tbody>'+list.map(qRow).join('')+'</tbody></table></div>','wide');

async function doStart(btn){
  var inp=document.getElementById('name'),v=inp?inp.value.trim():'';
  if(!v){var er=document.getElementById('nameErr');if(er)er.hidden=false;if(inp)inp.focus();return;}
  if(S.busy)return;
  S.busy=true;if(btn){btn.disabled=true;btn.textContent='جارٍ التجهيز…';}
  try{await Store.ready;}catch(e){}
  S.busy=false;
  S.name=v;await setupRec(v);
  S.live=null;S.lv=dv().unlocked;go('intro');
}
function pdfName(s){return 'report-'+s+'.pdf';}
async function doPdf(kind,id,fin){
  if(S.busy)return;S.busy=true;toast('جارٍ إنشاء ملف PDF…');
  try{
    var blocks;
    if(kind==='student'){
      var rec=(S.rec&&S.rec.id===id)?S.rec:allRecs().filter(function(r){return r.id===id;})[0];
      if(!rec){toast('تعذر العثور على السجل.');S.busy=false;return;}
      blocks=studentBlocks(studentModel(rec),fin);
    }else{blocks=teacherBlocks(analyze(tFilter()));}
    var bytes=await makePDF(blocks);
    await saveFile(kind==='student'?pdfName('student'):pdfName('teacher'),bytes);
  }catch(e){toast('تعذر إنشاء الملف.');}
  S.busy=false;
}
function act(a,b){
  switch(a){
    case 'enter':if(S.screen!=='start'){if(SIDE.indexOf(S.screen)<0)S.from=S.screen;}go('start');break;
    case 'start':doStart(b);break;
    case 'cont':var ou=openRun();if(ou){S.live=null;continueRun(ou);}break;
    case 'resume':if(S.live)go(S.live);break;
    case 'begin':var o2=openRun();if(o2&&o2.lv===S.lv)continueRun(o2);else startRun();break;
    case 'retry':startRun();break;
    case 'pick':S.lv=+b.getAttribute('data-lv');render(false);break;
    case 'tf':answerTF(b.getAttribute('data-v')==='1');break;
    case 'mc':answerMC(+b.getAttribute('data-i'));break;
    case 'pc':pickC(+b.getAttribute('data-id'));break;
    case 'pd':pickD(b.getAttribute('data-l'));break;
    case 'mcheck':checkM();break;
    case 'next':next();break;
    case 'nextlevel':S.lv++;go('intro');break;
    case 'final':go('final');beep(SND.win);confetti();break;
    case 'board':nav('board');break;
    case 'again':S.lv=0;S.live=null;go('intro');break;
    case 'report':nav('profile',true);break;
    case 'leave':var to=b.getAttribute('data-to');hideDlg();doNav(to);break;
    case 'stay':hideDlg();break;
    case 'tab':S.T.tab=b.getAttribute('data-t');render(false);break;
    case 'qd':qDialog(b.getAttribute('data-q'));break;
    case 'pf':S.T.pf=b.getAttribute('data-id');render(true);break;
    case 'pf-back':S.T.pf=null;S.T.tab='students';render(true);break;
    case 'pdf-student':doPdf('student',b.getAttribute('data-id'),b.getAttribute('data-final')==='1');break;
    case 'pdf-teacher':doPdf('teacher');break;
    case 'csv-students':saveFile('students.csv',csvStudents(analyze(tFilter())));break;
    case 'csv-answers':saveFile('answers.csv',csvAnswers(analyze(tFilter())));break;
    case 'csv-questions':saveFile('questions.csv',csvQuestions(analyze(tFilter())));break;
    case 'wipe':S.T.wipe=true;render(false);break;
    case 'wipe-no':S.T.wipe=false;render(false);break;
    case 'wipe-yes':
      S.T.wipe=false;
      wipeAll().then(function(){S.T.sid='all';S.T.progSid=null;toast('تم حذف بيانات الطلاب.');render(false);}).catch(function(){toast('تعذر حذف البيانات.');});
      break;
  }
}

  if(nb){nav(nb.getAttribute('data-nav'));return;}

  if(!b||b.disabled)return;
  act(b.getAttribute('data-act'),b);
});

    if(e.target.id==='name'){e.preventDefault();act('start',document.querySelector('[data-act=start]'));}
    else if(e.target.getAttribute&&e.target.getAttribute('data-act')==='qd'&&e.target.tagName==='TR'){act('qd',e.target);}

});

});

function esc2(s) {
  return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, function (c) {

function pickNoRepeat(key, arr) {
  var last = LSg.get('th-fb-' + key) || '';
  var pool = arr.filter(function (s) { return s !== last; });
  var out = pool.length ? rand(pool) : rand(arr);
  LSg.set('th-fb-' + key, out);

}

var THEME_KEY = 'th-theme';

function applyTheme(t, save) {
  t = (t === 'light') ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', t);
  var meta = document.querySelector('meta[name="theme-color"]');
  if (!meta) {
    meta = document.createElement('meta');
    meta.setAttribute('name', 'theme-color');
    document.head.appendChild(meta);
  }
  meta.setAttribute('content', t === 'light' ? '#EEF2FB' : '#0A1233');
  if (save) {
    LSg.set(THEME_KEY, t);
    var r = studentRec();
    if (r) { r.theme = t; T.persist(); }   /* يُحفظ في سجل الطالب أيضًا (قاعدة البيانات) */
  }
  paintThemeBtn();
}

var shownHearts = null;      /* الرقم المعروض حاليًا (للحركة التدريجية) */

var HEART_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.5-4.7-9.4-9.1C1.2 8.4 3.1 5 6.6 5c2 0 3.4 1.1 4.3 2.4l1.1 1.5 1.1-1.5C14 6.1 15.4 5 17.4 5c3.5 0 5.4 3.4 4 6.9C19.5 16.3 12 21 12 21z" fill="url(#gHeart)" stroke="#fff" stroke-width="1.4" stroke-opacity=".75" stroke-linejoin="round"/></svg>';

function buildTopbar() {
  var nb = document.querySelector('.navbar');
  if (!nb || byId('heartPill')) return;
  var pill = document.createElement('button');
  pill.type = 'button';
  pill.id = 'heartPill';
  pill.className = 'heartpill';
  pill.setAttribute('aria-live', 'polite');
  pill.setAttribute('title', 'رصيد القلوب');
  pill.innerHTML = '<span class="hrt">' + HEART_SVG + '</span><b id="heartNum">٠</b>';
  pill.addEventListener('click', function () {
    T.toast('القلوب: مكافأة على كل إجابة صحيحة (١٠ قلوب للسؤال) ومكافأة مختبر المثلثات.');
  });

  var tb = document.createElement('button');
  tb.type = 'button';
  tb.id = 'themeBtn';
  tb.className = 'icon-btn theme-btn';
  tb.addEventListener('click', function () { toggleTheme(); sfxTap(); });

  var snd = byId('snd');
  if (snd && snd.parentNode) {
    snd.parentNode.insertBefore(pill, snd);
    snd.parentNode.insertBefore(tb, snd);
  } else {
    nb.appendChild(pill); nb.appendChild(tb);
  }
  paintThemeBtn();
  paintHearts(shownHearts === null ? heartsNow() : shownHearts, true);
}

function paintHearts(v, instant) {
  var box = byId('heartNum');
  if (!box) return;
  var target = Math.max(0, v | 0);
  if (instant || shownHearts === null) {
    shownHearts = target;
    box.textContent = n2(target);
    return;
  }
  var from = shownHearts, to = target;
  if (from === to) { box.textContent = n2(to); return; }
  shownHearts = to;
  var t0 = performance.now(), dur = Math.min(900, 260 + Math.abs(to - from) * 12);
  (function step(t) {
    var k = Math.min(1, (t - t0) / dur);
    var e = 1 - Math.pow(1 - k, 3);
    box.textContent = n2(Math.round(from + (to - from) * e));
    if (k < 1) requestAnimationFrame(step);
    else { box.textContent = n2(to); bumpPill(); }
  })(t0);
}

function bumpPill() {
  var p = byId('heartPill');
  if (!p) return;
  p.classList.remove('bump');
  void p.offsetWidth;
  p.classList.add('bump');
}

/* حركة انتقال القلوب من موضع الإجابة إلى العدّاد */
function heartFly(fromRect, amount) {
  var pill = byId('heartPill');
  if (!pill) return;
  var to = pill.getBoundingClientRect();
  var count = amount >= 10 ? 3 : 1;
  for (var i = 0; i < count; i++) {
    (function (i) {
      var h = document.createElement('div');
      h.className = 'fly-heart';
      h.innerHTML = HEART_SVG;
      var sx = (fromRect ? fromRect.left + fromRect.width / 2 : window.innerWidth / 2) + (i - 1) * 26;
      var sy = (fromRect ? fromRect.top + fromRect.height / 2 : window.innerHeight / 2) + (i - 1) * 10;
      h.style.left = sx + 'px';
      h.style.top = sy + 'px';
      document.body.appendChild(h);
      var tx = to.left + to.width / 2 - sx, ty = to.top + to.height / 2 - sy;
      var delay = i * 90;
      if (motionOK() && h.animate) {
        var a = h.animate([
          { transform: 'translate(-50%,-50%) scale(.4) rotate(-12deg)', opacity: 0 },
          { transform: 'translate(-50%,-50%) scale(1.25) rotate(0deg)', opacity: 1, offset: .18 },
          { transform: 'translate(calc(-50% + ' + (tx * .55) + 'px), calc(-50% + ' + (ty * .35 - 60) + 'px)) scale(1.1)', opacity: 1, offset: .6 },
          { transform: 'translate(calc(-50% + ' + tx + 'px), calc(-50% + ' + ty + 'px)) scale(.35)', opacity: .15 }
        ], { duration: 900, delay: delay, easing: 'cubic-bezier(.3,.7,.4,1)', fill: 'forwards' });
        a.onfinish = function () { h.remove(); };
      } else {
        setTimeout(function () { h.remove(); }, 400);
      }
    })(i);
  }
  setTimeout(function () { sfxHeart(); }, 380);
}

/* خطاف الإجابة: يُنادى من النواة بعد كل إجابة */
EXT.onAnswer = function (info) {

    paintHearts(T.derive(r).hearts);
  }
};

/* هندسة المثلث: مثلث متساوي الساقين متماثل حول العمود الأوسط */
var BASE_Y = 268, MID_X = 220, PX_PER_CM = 13;
function labGeo() {
  var bw = LAB.bw, hh = LAB.hh;
  var A = { x: MID_X - bw, y: BASE_Y }, B = { x: MID_X + bw, y: BASE_Y }, C = { x: MID_X, y: BASE_Y - hh };
  var legPx = Math.sqrt(bw * bw + hh * hh);
  var apex = 2 * Math.atan2(bw, hh) * 180 / Math.PI;       /* زاوية الرأس */
  var base = (180 - apex) / 2;                              /* زاوية القاعدة */
  return {
    A: A, B: B, C: C, bw: bw, hh: hh,
    legCm: legPx / PX_PER_CM, baseCm: (2 * bw) / PX_PER_CM, heightCm: hh / PX_PER_CM,
    apex: apex, base: base, sum: apex + 2 * base, apexRounded: Math.round(apex * 10) / 10
  };
}
function fmtCm(v) { return n2((Math.round(v * 10) / 10).toFixed(1).replace('.', '٫')); }
function fmtDeg(v) { return n2((Math.round(v * 10) / 10).toFixed(1).replace('.', '٫')); }

function labEval() {
  var ts = labTasks();
  var done = 0;
  ts.forEach(function (t) {
    var ok;
    if (t.kind === 'do') {
      if (t.pass) LAB.ach[t.id] = true;          /* الهدف يبقى محققًا بعد تحقيقه */
      ok = !!LAB.ach[t.id];
    } else {
      ok = (LAB.ans[t.id] === t.correct);        /* السؤال يُحتسب مرة واحدة */
    }
    LAB.items[t.id] = ok;
    if (ok) done++;
  });
  LAB.score = Math.round(done * 100 / ts.length);
  var all = done === ts.length;
  if (all && !LAB.done) {
    LAB.done = true;
    saveLab(true);
    try { T.beep(T.SND.win); } catch (e) { }
    T.confetti();
    T.toast('أتممت مختبر المثلثات! +٢٥ قلبًا');
  } else if (!all) {
    saveLab(false);
  }
  return { ts: ts, done: done, all: all };
}

function saveLab(isDone) {
  var r = studentRec();
  if (!r) return;

  var g = labGeo();
  r.labs[LAB.lv] = {
    done: !!(prev.done || isDone),
    score: Math.max(prev.score || 0, LAB.score),
    best: Math.max(prev.best || 0, LAB.score),
    at: Date.now(),
    tries: (prev.tries || 0) + (isDone ? 0 : 1),
    items: LAB.items,

    ans: LAB.ans,

    lv: LAB.lv

/* ---------- رسم المختبر ---------- */
function protractor(cx, cy, r, from, to, color) {
  /* منقلة افتراضية: قوس بعلامات كل ١٠ درجات */
  var d = '', i;
  for (i = 0; i <= 180; i += 10) {
    var a = Math.PI * i / 180;
    var r1 = r, r2 = (i % 30 === 0) ? r - 12 : r - 6;
    d += '<line x1="' + (cx + r1 * Math.cos(a)).toFixed(1) + '" y1="' + (cy + r1 * Math.sin(a)).toFixed(1) +
      '" x2="' + (cx + r2 * Math.cos(a)).toFixed(1) + '" y2="' + (cy + r2 * Math.sin(a)).toFixed(1) +
      '" stroke="rgba(200,215,255,.45)" stroke-width="1"/>';
  }
  return '<g class="prot"><path d="M' + (cx - r) + ' ' + cy + ' A' + r + ' ' + r + ' 0 0 1 ' + (cx + r) + ' ' + cy + '" fill="none" stroke="rgba(200,215,255,.35)" stroke-width="2"/>' + d +
    '<path d="' + arcPath(cx, cy, r - 18, from, to) + '" fill="none" stroke="' + color + '" stroke-width="6" stroke-linecap="round" opacity=".9"/></g>';
}
function arcPath(cx, cy, r, a1, a2) {
  var p1 = { x: cx + r * Math.cos(a1), y: cy + r * Math.sin(a1) };
  var p2 = { x: cx + r * Math.cos(a2), y: cy + r * Math.sin(a2) };
  var large = Math.abs(a2 - a1) > Math.PI ? 1 : 0;
  var sweep = a2 > a1 ? 1 : 0;
  return 'M' + p1.x.toFixed(1) + ' ' + p1.y.toFixed(1) + ' A' + r + ' ' + r + ' 0 ' + large + ' ' + sweep + ' ' + p2.x.toFixed(1) + ' ' + p2.y.toFixed(1);
}

function labSVG() {
  var g = labGeo(), A = g.A, B = g.B, C = g.C;
  var eq = true;
  /* الزوايا بالراديان لرسم الأقواس */
  var angApex = Math.atan2(B.y - C.y, B.x - C.x);       /* اتجاه الساق اليمنى من الرأس */
  var angApex2 = Math.atan2(A.y - C.y, A.x - C.x);      /* اتجاه الساق اليسرى */
  var angBaseB = Math.atan2(C.y - B.y, C.x - B.x);      /* من القاعدة اليمنى إلى الرأس */
  var angBaseA = Math.atan2(C.y - A.y, C.x - A.x);
  var lab = '';
  /* لوحة المنقلة عند الرأس */
  lab += protractor(C.x, C.y, 118, angApex2, angApex, '#FFC93C');
  /* شبكة خفيفة */
  var grid = '';
  for (var gx = 20; gx < 440; gx += 20) grid += '<line x1="' + gx + '" y1="30" x2="' + gx + '" y2="290" stroke="rgba(120,150,255,.07)" stroke-width="1"/>';
  for (var gy = 30; gy < 300; gy += 20) grid += '<line x1="0" y1="' + gy + '" x2="440" y2="' + gy + '" stroke="rgba(120,150,255,.07)" stroke-width="1"/>';

  return '<svg id="labSvg" viewBox="0 0 440 320" class="labsvg" role="application" aria-label="مثلث متساوي الساقين تفاعلي">' +
    grid +
    '<polygon points="' + A.x + ',' + A.y + ' ' + B.x + ',' + B.y + ' ' + C.x + ',' + C.y + '" fill="rgba(85,168,255,.16)" stroke="#55A8FF" stroke-width="3.5" stroke-linejoin="round"/>' +
    /* علامات تساوي الساقين */
    '<g stroke="#35E8A2" stroke-width="3" stroke-linecap="round">' +
    '<line x1="' + ((A.x + C.x) / 2 - 6) + '" y1="' + ((A.y + C.y) / 2 - 6) + '" x2="' + ((A.x + C.x) / 2 + 6) + '" y2="' + ((A.y + C.y) / 2 + 6) + '"/>' +
    '<line x1="' + ((B.x + C.x) / 2 - 6) + '" y1="' + ((B.y + C.y) / 2 + 6) + '" x2="' + ((B.x + C.x) / 2 + 6) + '" y2="' + ((B.y + C.y) / 2 - 6) + '"/></g>' +
    /* محور التماثل */
    '<line x1="' + C.x + '" y1="' + (C.y + 6) + '" x2="' + C.x + '" y2="' + (A.y - 8) + '" stroke="rgba(255,201,60,.55)" stroke-width="2" stroke-dasharray="6 6"/>' +
    /* أقواس الزوايا */
    '<path d="' + arcPath(C.x, C.y, 46, angApex2, angApex) + '" fill="rgba(255,201,60,.22)" stroke="#FFC93C" stroke-width="3"/>' +
    '<path d="' + arcPath(A.x, A.y, 40, angBaseA - Math.PI, angBaseA > 0 ? angBaseA : angBaseA) + '" fill="none" stroke="#7CE7FF" stroke-width="0"/>' +
    /* مقابض السحب */
    '<circle class="lh" data-h="apex" cx="' + C.x + '" cy="' + C.y + '" r="17" fill="#FFC93C" stroke="#fff" stroke-width="3"/>' +
    '<circle class="lh" data-h="left" cx="' + A.x + '" cy="' + A.y + '" r="14" fill="#7CE7FF" stroke="#fff" stroke-width="3"/>' +
    '<circle class="lh" data-h="right" cx="' + B.x + '" cy="' + B.y + '" r="14" fill="#7CE7FF" stroke="#fff" stroke-width="3"/>' +
    /* التسميات */
    '<text class="lab-t" x="' + (C.x + 4) + '" y="' + (C.y - 20) + '" text-anchor="middle">زاوية الرأس ' + fmtDeg(g.apex) + '°</text>' +
    '<text class="lab-t" x="' + (A.x - 6) + '" y="' + (A.y + 26) + '" text-anchor="start">' + fmtDeg(g.base) + '°</text>' +
    '<text class="lab-t" x="' + (B.x + 6) + '" y="' + (B.y + 26) + '" text-anchor="end">' + fmtDeg(g.base) + '°</text>' +
    '<text class="lab-t side" x="' + ((A.x + C.x) / 2 - 26) + '" y="' + ((A.y + C.y) / 2 - 6) + '" text-anchor="end">ساق ' + fmtCm(g.legCm) + ' سم</text>' +
    '<text class="lab-t side" x="' + ((B.x + C.x) / 2 + 26) + '" y="' + ((B.y + C.y) / 2 - 6) + '" text-anchor="start">ساق ' + fmtCm(g.legCm) + ' سم</text>' +
    '<text class="lab-t side" x="' + MID_X + '" y="' + (BASE_Y + 26) + '" text-anchor="middle">القاعدة ' + fmtCm(g.baseCm) + ' سم</text>' +
    '<text class="lab-eq" x="' + MID_X + '" y="24" text-anchor="middle">الساقان متساويتان ✓ · مجموع الزوايا ' + fmtDeg(g.sum) + '°</text>' +
    '</svg>';
}

/* ---- تفاعل السحب ---- */
function labAttach() {
  var svg = byId('labSvg');
  if (!svg) return;
  var dragging = null;

  function toSvg(evt) {
    var r = svg.getBoundingClientRect();
    var x = (evt.clientX - r.left) * 440 / r.width;
    var y = (evt.clientY - r.top) * 320 / r.height;
    return { x: x, y: y };
  }
  function setFrom(kind, p) {
    if (kind === 'apex') {
      LAB.hh = clamp(BASE_Y - p.y, 40, 230);
    } else {
      LAB.bw = clamp(Math.abs(p.x - MID_X), 45, 175);
    }
    LAB.moved++;
    labEval();
    labRefresh();
  }
  svg.addEventListener('pointerdown', function (e) {
    var h = e.target && e.target.getAttribute ? e.target.getAttribute('data-h') : null;
    if (!h) return;
    dragging = h;
    svg.setPointerCapture && svg.setPointerCapture(e.pointerId);
    e.preventDefault();
  });
  svg.addEventListener('pointermove', function (e) {
    if (!dragging) return;
    setFrom(dragging, toSvg(e));
    e.preventDefault();
  });
  window.addEventListener('pointerup', function () { dragging = null; });
  svg.addEventListener('pointercancel', function () { dragging = null; });
}

function labRefresh() {
  var stage = document.querySelector('.labstage');
  if (!stage) { T.render(false); return; }
  var g = labGeo(), E = labEval();
  stage.innerHTML = labSVG() + '<div class="labread">' +
    '<div class="lrd"><span>طول الساق</span><b>' + fmtCm(g.legCm) + ' سم</b></div>' +
    '<div class="lrd"><span>طول القاعدة</span><b>' + fmtCm(g.baseCm) + ' سم</b></div>' +
    '<div class="lrd"><span>زاوية الرأس</span><b>' + fmtDeg(g.apex) + '°</b></div>' +
    '<div class="lrd"><span>زاويتا القاعدة</span><b>' + fmtDeg(g.base) + '° / ' + fmtDeg(g.base) + '°</b></div>' +
    '<div class="lrd"><span>مجموع الزوايا</span><b>' + fmtDeg(g.sum) + '°</b></div>' +
    '<div class="lrd"><span>حالة الساقين</span><b class="ok-t">متساويتان ✓</b></div></div>';
  labAttach();
  /* تحديث المهام دون إعادة بناء الصفحة كلها */
  var list = document.querySelector('.labtasks');
  if (list) {
    var ts = E.ts;
    Array.prototype.forEach.call(list.children, function (li, i) {
      var t = ts[i]; if (!t) return;
      li.classList.toggle('ok', !!LAB.items[t.id]);
      var tick = li.querySelector('.tick');
      if (tick) tick.textContent = LAB.items[t.id] ? '✓' : '○';
    });
  }
  var bar = document.querySelector('.labprog');
  if (bar) bar.innerHTML = '<div class="bar"><i style="width:' + LAB.score + '%"></i></div><span>' + n2(E.done) + ' من ' + n2(E.ts.length) + ' مهام مكتملة · ' + n2(LAB.score) + '٪</span>';
  var sl = document.querySelectorAll('[data-lab]');
  Array.prototype.forEach.call(sl, function (inp) {
    if (document.activeElement === inp) return;
    inp.value = inp.getAttribute('data-lab') === 'hh' ? Math.round(LAB.hh) : Math.round(LAB.bw);
  });
}

document.addEventListener('input', function (e) {
  var k = e.target && e.target.getAttribute ? e.target.getAttribute('data-lab') : null;
  if (!k || !LAB) return;
  var v = +e.target.value;
  if (k === 'hh') LAB.hh = v; else LAB.bw = v;

EXT.labsTab = function (A) {
  var D = A.D || [];
  var rows = [0, 1, 2].map(function (l) {
    var done = D.filter(function (x) { return x.d.labOf(l) && x.d.labOf(l).done; });
    var any = D.filter(function (x) { return !!x.d.labOf(l); });
    var scores = any.map(function (x) { return x.d.labOf(l).score || 0; });
    var avg = scores.length ? Math.round(scores.reduce(function (a, b) { return a + b; }, 0) / scores.length) : null;
    return '<tr><td>' + T.LV[l].name + '</td><td>' + n2(any.length) + '</td><td>' + n2(done.length) + '</td>' +
      '<td>' + (A.total ? pctStr(done.length, A.total) : '—') + '</td>' +
      '<td>' + (avg === null ? '—' : n2(avg) + '٪') + '</td></tr>';
  }).join('');

  /* الأخطاء المتكررة في المختبر: بنود لم تتحقق لدى الطلاب */
  var fails = {};
  D.forEach(function (x) {
    [0, 1, 2].forEach(function (l) {
      var lab = x.d.labOf(l); if (!lab || !lab.items) return;
      Object.keys(lab.items).forEach(function (k) {
        if (!lab.items[k]) fails[k] = (fails[k] || 0) + 1;
      });
    });
  });
  var TITLES = {
    t1: 'ضبط زاوية الرأس على ٩٠°', t2: 'جعل زاويتي القاعدة ٦٥°', t3: 'زاوية رأس منفرجة',
    t4: 'المحافظة على تساوي الساقين', q1: 'حساب مجموع زاويتي القاعدة', q2: 'العلاقة بين زاويتي القاعدة'
  };
  var failRows = Object.keys(fails).sort(function (a, b) { return fails[b] - fails[a]; }).map(function (k) {
    return '<li><b>' + esc2(TITLES[k] || k) + '</b> — لم يتحقق لدى ' + n2(fails[k]) + ' محاولة</li>';
  }).join('');

  return panelLocal('تحليل مختبر المثلثات التفاعلي',
    '<p class="muted">نسبة إكمال النشاط ومتوسط الدرجات لكل مستوى، والأخطاء المتكررة في مهام المختبر.</p>' +
    '<div class="tablewrap"><table class="mini"><thead><tr><th>المستوى</th><th>طلاب فتحوا المختبر</th><th>أتموه</th><th>نسبة الإكمال</th><th>متوسط الدرجة</th></tr></thead><tbody>' +
    rows + '</tbody></table></div>') +
    panelLocal('الأخطاء المتكررة في مهام المختبر',
      failRows ? '<ul class="ul">' + failRows + '</ul>' : '<p class="muted">لا توجد أخطاء مسجلة بعد.</p>') +
    panelLocal('مهام المختبر وأهدافها التعليمية',
      '<ul class="ul"><li>ضبط زاوية الرأس على ٩٠° يوضّح العلاقة بين الزوايا ومجموعها ١٨٠°.</li>' +
      '<li>جعل زاويتي القاعدة ٦٥° يتطلب تطبيق قانون الزوايا في المثلث متساوي الساقين.</li>' +
      '<li>ملاحظة أن كبر زاوية الرأس يصغّر زاويتي القاعدة (علاقة عكسية).</li>' +
      '<li>التأكيد العملي على أن الساقين متساويتان في كل أوضاع المثلث.</li></ul>');

      .then(function (b) { dlBlob(b, 'triangle-heroes-' + kind + '.xlsx'); T.toast('تم تنزيل ملف Excel.'); })
      .catch(function () { T.toast('تعذر إنشاء ملف Excel.'); });
  };
});

/* ==================== 80_api.js ==================== */
/* ---------- عميل قاعدة البيانات المشتركة (خادم محلي/شبكي) ---------- */
var THAPI = window.THAPI = {
  base: '/api',
  ready: false,        /* هل الخادم متاح؟ */
  uid: '',             /* معرّف الطالب في قاعدة البيانات */
  rec: null,           /* سجل الطالب القادم من الخادم */
  boardList: [],
  token: '',           /* رمز جلسة المعلم (يُخزَّن في الذاكرة/sessionStorage فقط) */
  err: null,
  lastSync: 0
};

function apiFetch(path, opt, ms) {
  opt = opt || {};
  var ctl = window.AbortController ? new AbortController() : null;
  var to = setTimeout(function () { if (ctl) ctl.abort(); }, ms || 6000);
  opt.headers = opt.headers || {};
  if (opt.body && !opt.headers['Content-Type']) opt.headers['Content-Type'] = 'application/json';
  if (THAPI.token) opt.headers['X-Teacher-Token'] = THAPI.token;
  if (THAPI.uid) opt.headers['X-Student-Id'] = THAPI.uid;
  if (ctl) opt.signal = ctl.signal;
  return fetch(THAPI.base + path, opt).then(function (res) {
    clearTimeout(to);
    var ct = res.headers.get('content-type') || '';
    if (ct.indexOf('application/json') < 0) return res.text().then(function (t) { throw new Error('bad-response:' + t.slice(0, 60)); });
    return res.json().then(function (j) {
      if (!res.ok) { var e = new Error(j.error || ('HTTP ' + res.status)); e.code = j.code; e.status = res.status; throw e; }
      return j;
    });
  }, function (e) { clearTimeout(to); throw e; });
}

window.THAPI_PROMISE = (function () {
  /* عند فتح الملف مباشرة (file://) لا يوجد خادم: نعمل بوضع التخزين المحلي */
  if (location.protocol === 'file:') { THAPI.ready = false; return Promise.resolve(false); }
  return apiFetch('/health', {}, 3500).then(function (h) {
    if (!h || !h.ok) { THAPI.ready = false; return; }
    THAPI.ready = true;
    THAPI.uid = LSg.get('th-uid') || '';
    THAPI.token = (window.sessionStorage && sessionStorage.getItem('th-tt')) || '';
    var boot = THAPI.uid
      ? apiFetch('/student/' + encodeURIComponent(THAPI.uid), {}, 6000).catch(function () { return null; })
      : Promise.resolve(null);
    return boot.then(function (res) {
      if (res && res.rec) THAPI.rec = res.rec;
      else { THAPI.uid = ''; THAPI.rec = null; }
      return THAPI.board().catch(function () { return []; });
    }).then(function (list) {
      THAPI.boardList = list || [];
      try { THAPI.live(function (l) { T.Store.board = l; if (T.S.screen === 'board') T.render(false); }); } catch (e) { }
      return true;
    });
  }).catch(function (e) { THAPI.ready = false; THAPI.err = e; return false; });
})();

THAPI.board = function () {
  return apiFetch('/board', {}, 6000).then(function (j) { THAPI.boardList = j.list || []; return THAPI.boardList; });
};

THAPI.register = function (name, av, sex) {
  return apiFetch('/student', { method: 'POST', body: JSON.stringify({ uid: THAPI.uid || '', name: name, av: av, sex: sex }) }, 8000)
    .then(function (j) {
      THAPI.uid = j.uid;
      THAPI.rec = j.rec || null;
      LSg.set('th-uid', j.uid);                 /* معرّف ثابت: لا سجلات مكررة عند تحديث الصفحة */
      return j;
    });
};

THAPI.save = function (rec) {
  if (!rec) return Promise.resolve();
  return apiFetch('/student/' + encodeURIComponent(rec.id) + '/save', { method: 'POST', body: JSON.stringify({ rec: rec }) }, 8000)
    .then(function (j) { THAPI.lastSync = Date.now(); return j; });
};

THAPI.live = function (cb) {
  if (!THAPI.ready || !window.EventSource || THAPI._es) return;
  try {
    var es = new EventSource(THAPI.base + '/events');
    es.addEventListener('board', function (e) {
      try { var j = JSON.parse(e.data); if (j && j.list) cb(j.list); } catch (x) { }
    });
    es.onerror = function () { /* إعادة الاتصال تلقائية */ };
    THAPI._es = es;
  } catch (e) { }
};

THAPI.students = function () {
  return apiFetch('/teacher/students', {}, 12000).then(function (j) { return j.list || []; });
};
THAPI.login = function (pw) {
  return apiFetch('/teacher/login', { method: 'POST', body: JSON.stringify({ password: pw }) }, 8000).then(function (j) {
    if (!j || j.ok === false) { var e = new Error(j && j.error || 'bad-password'); e.code = (j && j.code) || 'bad-password'; throw e; }
    THAPI.token = j.token;
    if (window.sessionStorage) sessionStorage.setItem('th-tt', j.token);
    T.Store.isTeacher = true;
    return j;
  });
};
THAPI.logout = function () {
  var p = THAPI.token ? apiFetch('/teacher/logout', { method: 'POST' }, 5000).catch(function () { }) : Promise.resolve();
  THAPI.token = '';
  if (window.sessionStorage) sessionStorage.removeItem('th-tt');
  T.Store.isTeacher = false;
  return p;
};
THAPI.exportXlsx = function (kind, q) {
  var url = THAPI.base + '/teacher/export.xlsx?kind=' + encodeURIComponent(kind) + '&' + (q || '');
  return fetch(url, { headers: { 'X-Teacher-Token': THAPI.token } }).then(function (r) {
    if (!r.ok) throw new Error('export failed');
    return r.blob();
  });
};

/* ---------- التهيئة والتوصيلات النهائية ---------- */
EXT.screen = function (name) {
  switch (name) {
    case 'map': return mapView();

/* زر الدليل المصوّر + مختبر المستوى داخل شاشة تعليمات المستوى */
EXT.introExtra = function () {
  var r = studentRec(); if (!r) return '';
  var d = T.derive(r);
  var lab = d.labOf(T.S.lv);
  return '<div class="intro-tools">' +
    '<button class="btn alt" type="button" data-act="guide">شرح مصوّر خطوة بخطوة</button>' +

    (lab && lab.done ? '<span class="ok-t">✓</span>' : '') + '</button></div>';
};

/* أزرار إضافية في شاشة النتيجة */
EXT.resultExtra = function () {
  var r = studentRec(); if (!r) return '';
  var d = T.derive(r), lv = T.S.lv, t = T.tiers && T.tiers[lv];
  var right = T.S.run ? T.S.run.right : 0;
  var tier = T.tierOf(right);
  var lab = d.labOf(lv);
  var hearts = T.heartsOf(r);
  var out = '<div class="result-strip">' +
    '<div class="rs-item"><span class="hrt">' + HEART_SVG + '</span><b>' + n2(hearts.total) + '</b><span class="muted">رصيد القلوب</span></div>' +
    '<div class="rs-item sig-' + tier + '"><b>' + n2(right) + ' / ١٠</b><span>' + pctStr(right, 10) + '</span></div>' +
    '</div>';
  if (tier === 'yellow' || tier === 'green') {
    out += '<div class="btnrow" style="justify-content:center;margin-top:10px">' +
      '<button class="btn" type="button" data-act="golab" data-lv="' + lv + '">' +
      (lab && lab.done ? 'إعادة مختبر المثلثات' : 'ابدأ مختبر المثلثات (+٢٥ قلبًا)') + '</button></div>';
  }
  return out;
};

/* زر شهادة الإنجاز في الشاشة الختامية */
EXT.finalExtra = function () {
  return '<div class="btnrow" style="justify-content:center"><button class="btn" type="button" data-act="cert">شهادة الإنجاز</button></div>';
};

/* ---- موزّع أفعال طبقة التطوير (يعمل قبل معالج النواة) ---- */
document.addEventListener('click', function (e) {
  var t = e.target;
  if (!t || !t.closest) return;
  var b = t.closest('[data-act]');
  if (!b || b.disabled) return;
  var a = b.getAttribute('data-act');
  if (EXT.acts && EXT.acts[a]) {
    e.preventDefault();
    e.stopPropagation();
    try { EXT.acts[a](b); } catch (err) { console.error(err); }
  }
}, true);

/* ---- التشغيل ---- */
EXT.boot = function () {
  /* المظهر: تفضيل محفوظ على الجهاز، ثم المظهر المحفوظ في سجل الطالب */
  var saved = LSg.get(THEME_KEY);
  if (!saved) saved = 'dark';
  applyTheme(saved, false);
  if (LSg.get('th-nomotion')) document.documentElement.classList.add('no-motion');
  if (!studentRec()) {                       /* استعادة آخر اسم على الجهاز (بلا سجلات وهمية) */
    var last = LSg.get('th-last');
    if (last && !T.S.name) T.S.name = last;
  }
  buildTopbar();
  T.render(false);
  openTeacherEntry();
};

/* مدخل المعلم المستقل المحمي: يعمل عبر الرابط الخاص #teacher فقط،
   ولا تظهر أدوات المعلم في شريط تنقل الطالب. */
function openTeacherEntry() {
  var h = (location.hash || '').replace('#', '').toLowerCase();
  var q = new URLSearchParams(location.search || '');
  if (h === 'teacher' || q.get('teacher') === '1') {
    THAPI_PROMISE.then(function () { T.go('teacher'); });
  }
}
window.addEventListener('hashchange', openTeacherEntry);

/* بعد تحميل سجل الطالب من قاعدة البيانات: مزامنة المظهر والصورة الرمزية */
EXT.afterReady = function () {
  var r = studentRec();
  if (!r) return;
  if (r.theme && LSg.get(THEME_KEY) !== r.theme) applyTheme(r.theme, false);
  if (!chosenAvatar() && r.av) LSg.set('th-av', r.av);
};
/* تشغيل التهيئة فور تحميل الطبقة */
try { EXT.boot(); } catch (e) { console.error(e); }

/* إعلام النواة بأن طبقة التطوير جاهزة (لتحديد وضع قاعدة البيانات بشكل صحيح) */
if (window.__TH_EXT_READY_RESOLVE) { try { window.__TH_EXT_READY_RESOLVE(); } catch (e) { } }

})();
